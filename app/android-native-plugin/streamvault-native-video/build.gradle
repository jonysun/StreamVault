plugins {
    id 'com.android.library'
}

android {
    namespace 'com.streamvault.nativefeed'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(':dcloud-stubs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.alibaba:fastjson:1.2.83'

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('copyReleaseAarToUniPlugin', Copy) {
    dependsOn 'assembleRelease'
    from layout.buildDirectory.file('outputs/aar/streamvault-native-video-release.aar')
    into '../../uniapp/spirit/nativeplugins/StreamVault-NativeVideo/android'
}
