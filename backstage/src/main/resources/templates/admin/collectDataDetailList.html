<!DOCTYPE html>
<html class="x-admin-sm">
    <head>
        <meta charset="UTF-8">
        <title>视频管理-进程列表</title>
        <meta name="renderer" content="webkit">
        <th:block th:insert="~{admin/include/header :: metaHeader}"></th:block>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
        <link rel="stylesheet" href="/static/css/font.css">
        <link rel="stylesheet" href="/static/css/xadmin.css">
        <script type="text/javascript" src="/static/js/jquery.min.js"></script>
        <script src="/static/lib/layui/layui.js" charset="utf-8"></script>
        <script type="text/javascript" src="/static/js/xadmin.js"></script>
        <script type="text/javascript" src="/static/js/common.js"></script>
        <!--[if lt IE 9]>
          <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
          <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
        <![endif]-->
    <style>
        .layui-table-cell {
            height: auto;
            line-height: 20px;
            padding: 8px;
            position: relative;
            box-sizing: border-box;
        }
        .video-title {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1e88e5;
            cursor: pointer;
        }
        .video-title:hover {
            color: #0d47a1;
            text-decoration: underline;
        }
        .video-id {
            color: #666;
            font-family: monospace;
            font-size: 13px;
        }
        .layui-table {
            margin: 0;
            background-color: #fff;
            border-radius: 4px;
        }
        .layui-table thead tr {
            background-color: #fafafa;
        }
        .layui-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        .layui-table-header {
            border-radius: 4px 4px 0 0;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.5;
            font-weight: 500;
        }
        .status-completed {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #fff3e0;
            color: #f57c00;
        }
        .status-error {
            background-color: #ffebee;
            color: #c62828;
        }
        .layui-table-tool {
            background-color: transparent;
            border: none;
            padding: 0 0 10px 0;
        }
        .create-time {
            color: #666;
            font-size: 12px;
        }
        .tooltip-content {
            display: none;
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 999;
            max-width: 300px;
            word-wrap: break-word;
        }
    </style>
    </head>
    <body>
		<input id="taskid" type="hidden" th:value="${taskid}"/> 
        <div class="layui-fluid" style="padding: 10px;">
                    <div class="layui-card">
                <div class="layui-card-body">
                    <form class="layui-form">
                        <div class="layui-form-item" style="margin-bottom: 0;">
                            <div class="layui-inline">
                                <select id="status" lay-filter="status">
                                    <option value="">全部状态</option>
  										<option value="已完成">已完成</option>
  										<option value="未下载">未下载</option>
  										<option value="不支持">不支持</option>
                           			 </select>   
                                </div>
                            <div class="layui-inline">
                                <button type="button" class="layui-btn layui-btn-normal search">搜索</button>
                                <button type="button" class="layui-btn layui-btn-primary initList">重置</button>
                            </div>
                        </div>
                    </form>
                    </div>
                <div class="layui-card-body" style="padding-top: 0;">
                    <table class="layui-hide" id="projectList" lay-filter="projectList"></table>
                </div>
            </div>
        </div> 
           
    </body>        
	<script  th:inline="none">
    var table;
     $(function(){
    	 initLayer();
    	 loadTable();
    	 search();
    	 initList();
     })
     function initList(){
    	 $('.initList').click(function(){
    	     window.location.reload();
    	 })
     }
     function initLayer(){
    	 layui.use(['laydate','form'], function(){
             var laydate = layui.laydate;
             var  form = layui.form;

             form.on('submit(add)',
                     function(data) {
                         console.log(data);
         	           return false;
           			 });


           });
 
     }
     function search(){
    		$('.search').click(function(){
    			 var option = {}
    			 var  status = $('#status').val();
    			 if(status != "" ){
    				 option['status']= status;
    			 }
    			 var  dataid = $('#taskid').val();
    			 if(dataid != "" ){
    				 option['dataid']= dataid;
    			 }
    	         table.reload('projectList', {
    	             page: {
    	                 curr:1
    	             }, 
    	 			 method:'post',
    	 			 url: '/admin/api/findCollectDataDetail',
    	             where: option
    	         })
    		})
     }
     function loadTable(){
			layui.use(['table','form'], function(){
    			 var option = {}
    			 var  dataid = $('#taskid').val();
    			 if(dataid != "" ){
    				 option['dataid']= dataid;
    			 }
    			  table = layui.table;
    			  var form = layui.form;
			  table.render({
    				id:'projectList',
    				elem: '#projectList',
    				height: 'full-100',
    				method:'post',
    				url: '/admin/api/findCollectDataDetail',
    				where: option,
    				limit:15,
    				even: true,
    				size: 'lg',
    				request: {
    				     pageName: 'pageNo',
    				     limitName: 'pageSize'
    				},
    				page: { 
    			        layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
    			        limits:[15,30,45],
    			        first: false,
    			        last: false,
    			     },
			     cols: [[ 
			    	 {field: 'id', title: 'ID', width: 80, sort: true, align: 'center'},
			    	 {field: 'videoid', title: '视频ID', width: 160, templet: function(d){
			    		 return '<span class="video-id">' + d.videoid + '</span>';
			    	 }},
			    	 {field: 'mediatype', title: '媒体类型', width: 100, align: 'center', templet: function(d){
			    		 var t = d.mediatype || 'unknown';
			    		 if (t === 'video') return '<span class="status-badge status-completed">视频</span>';
			    		 if (t === 'image') return '<span class="status-badge status-pending">图文</span>';
			    		 if (t === 'mix') return '<span class="status-badge status-error">混合</span>';
			    		 return '<span class="status-badge">' + t + '</span>';
			    	 }},
			    	 {field: 'videoname', title: '内容标题/描述', minWidth: 300, templet: function(d){
			    		 return '<div class="video-title" lay-event="showTip">' + d.videoname + '</div>';
			    	 }},
			    	 {field: 'status', title: '状态', width: 120, align: 'center', templet: function(d){
			    		 var statusClass = '';
			    		 if(d.status === '已完成' || d.status === '图文已完成') statusClass = 'status-completed';
			    		 else if(d.status === '未下载') statusClass = 'status-pending';
			    		 else if(d.status === '不支持' || d.status === '执行失败') statusClass = 'status-error';
			    		 return '<span class="status-badge ' + statusClass + '">' + d.status + '</span>';
			    	 }},
			    	 {field: 'errorcode', title: '错误码', width: 160, align: 'center', templet: function(d){
			    		 return d.errorcode ? '<span class="video-id">' + d.errorcode + '</span>' : '--';
			    	 }},
			    	 {field: 'errormsg', title: '错误信息', width: 220, templet: function(d){
			    		 return d.errormsg ? '<span title="'+ d.errormsg +'">' + d.errormsg + '</span>' : '--';
			    	 }},
			    	 {field: 'detailjson', title: '原始JSON', width: 120, align: 'center', templet: function(d){
			    		 if(!d.detailjson){ return '--'; }
			    		 var escaped = encodeURIComponent(d.detailjson);
			    		 return '<button class="layui-btn layui-btn-xs layui-btn-normal" onclick="showTextDialog(\'原始JSON\', decodeURIComponent(\'' + escaped + '\'))">查看JSON</button>';
			    	 }},
			    	 {field: 'processlog', title: '任务日志', width: 120, align: 'center', templet: function(d){
			    		 if(!d.processlog){ return '--'; }
			    		 var escaped = encodeURIComponent(d.processlog);
			    		 return '<button class="layui-btn layui-btn-xs" onclick="showTextDialog(\'任务日志\', decodeURIComponent(\'' + escaped + '\'))">查看日志</button>';
			    	 }},
			    	 {field: 'createtime', title: '提交时间', width: 160, align: 'center', templet: function(d){
			    		 return '<span class="create-time">' + d.createtime + '</span>';
			    	 }}
			     ]],
    			     title: '媒体表'	,
    			     parseData:function(res){
    			    	 console.log(res);
    			    	 return {
    			             "code": 0, 
    			             "msg": "",
    			             "count": res.record.page.totalElements,
    			             "data": res.record.content
    			         };
    			     },
    			     done: function(){
    			    	 // 添加鼠标悬停显示完整标题的功能
    			    	 $('.video-title').hover(function(e){
    			    		 var title = $(this).text();
    			    		 var tooltip = $('<div class="tooltip-content">' + title + '</div>');
    			    		 $('body').append(tooltip);
    			    		 tooltip.css({
    			    			 left: e.pageX + 10,
    			    			 top: e.pageY + 10
    			    		 }).fadeIn('fast');
    			    	 }, function(){
    			    		 $('.tooltip-content').remove();
    			    	 }).mousemove(function(e){
    			    		 $('.tooltip-content').css({
    			    			 left: e.pageX + 10,
    			    			 top: e.pageY + 10
    			    		 });
    			    	 });
    			     }
	 			  });

	 			  window.showTextDialog = function(title, text){
	 				  var safeText = text || '';
	 				  layer.open({
	 					  type: 1,
	 					  title: title,
	 					  area: ['70%', '70%'],
	 					  content: '<div style="padding:12px;"><pre style="white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;">'+
	 					  $('<div/>').text(safeText).html() + '</pre></div>'
	 				  });
	 			  }
			  
			  

			  
    			  
    			});
    	}

    </script>
</html>
