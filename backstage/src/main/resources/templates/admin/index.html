<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>StreamVault-管理</title>
    <th:block th:insert="~{admin/include/header :: metaHeader}"></th:block>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../static/css/style.min.css" rel="stylesheet">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .lyear-layout-content {
            height: calc(100vh - 68px);
            padding-top: 68px !important;
            overflow: hidden;
        }

        .lyear-layout-content > .container-fluid.feed-page {
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }

        .feed-page.container-fluid {
            height: 100%;
            overflow: hidden;
        }

        .feed-page .row,
        .feed-page .col-lg-12,
        .feed-page .card,
        .feed-page .card-body {
            height: 100%;
            min-height: 0;
        }

        .feed-page .card {
            margin-bottom: 0;
        }

        .feed-page .card-body {
            position: relative;
            padding: 0 !important;
            overflow: hidden;
        }

        .video-feed {
            display: none;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: #000;
            overscroll-behavior-y: contain;
            touch-action: none;
        }

        .feed-controls {
            display: none;
            position: absolute;
            right: 12px;
            top: 18px;
            z-index: 6;
            gap: 10px;
            flex-direction: column;
        }

        .feed-control-btn {
            border: 0;
            border-radius: 999px;
            width: 48px;
            height: 48px;
            font-size: 11px;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .feed-control-btn:hover {
            background: rgba(0, 0, 0, 0.62);
        }

        .feed-control-btn i {
            font-size: 18px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .feed-control-btn span {
            line-height: 1;
            transform: scale(0.95);
        }

        .feed-playlist-drawer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 320px;
            z-index: 9;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateX(102%);
            transition: transform .2s ease;
            display: flex;
            flex-direction: column;
        }

        .feed-playlist-drawer.open {
            transform: translateX(0);
        }

        .feed-playlist-header {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 14px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feed-playlist-close {
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 18px;
            line-height: 1;
            padding: 0;
        }

        .feed-playlist-list {
            overflow-y: auto;
            padding: 10px;
            flex: 1;
        }

        .feed-playlist-item {
            display: block;
            width: 100%;
            border: 0;
            text-align: left;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 9px 10px;
            font-size: 12px;
        }

        .feed-playlist-item.active {
            background: rgba(86, 156, 255, 0.4);
        }

        .feed-playlist-item .meta {
            display: block;
            opacity: .75;
            margin-top: 4px;
            font-size: 11px;
        }

        .feed-author-drawer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 320px;
            z-index: 9;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateX(102%);
            transition: transform .2s ease;
            display: flex;
            flex-direction: column;
        }

        .feed-author-drawer.open {
            transform: translateX(0);
        }

        .feed-author-profile-drawer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: min(430px, 92vw);
            z-index: 12;
            background: rgba(8, 8, 8, 0.96);
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateX(102%);
            transition: transform .22s ease;
            display: flex;
            flex-direction: column;
        }

        .feed-author-profile-drawer.open {
            transform: translateX(0);
        }

        .feed-author-profile-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .feed-author-profile-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feed-author-profile-avatar,
        .feed-author-action-avatar {
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255,255,255,0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }

        .feed-author-profile-avatar {
            width: 64px;
            height: 64px;
            font-size: 22px;
        }

        .feed-author-profile-avatar img,
        .feed-author-action-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feed-author-profile-name {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.25;
        }

        .feed-author-profile-sub {
            margin-top: 4px;
            color: rgba(255,255,255,0.72);
            font-size: 12px;
            word-break: break-all;
        }

        .feed-author-profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px;
        }

        .feed-author-profile-stat {
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            padding: 9px 8px;
            text-align: center;
        }

        .feed-author-profile-stat strong {
            display: block;
            font-size: 16px;
        }

        .feed-author-profile-stat span {
            display: block;
            margin-top: 2px;
            color: rgba(255,255,255,0.68);
            font-size: 11px;
        }

        .feed-author-profile-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .feed-author-profile-tab {
            flex: 1;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.7);
            padding: 12px 6px;
            font-size: 13px;
        }

        .feed-author-profile-tab.active {
            color: #fff;
            box-shadow: inset 0 -2px 0 #fff;
        }

        .feed-author-profile-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .feed-author-work-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .feed-author-work-card {
            border: 0;
            padding: 0;
            overflow: hidden;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            text-align: left;
        }

        .feed-author-work-cover {
            aspect-ratio: 3 / 4;
            background: #111;
            position: relative;
        }

        .feed-author-work-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feed-author-work-type {
            position: absolute;
            left: 6px;
            top: 6px;
            border-radius: 999px;
            background: rgba(0,0,0,0.58);
            padding: 2px 6px;
            font-size: 10px;
        }

        .feed-author-work-title {
            padding: 6px;
            font-size: 11px;
            line-height: 1.35;
            min-height: 36px;
        }

        .feed-author-action-rail {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .feed-author-avatar-btn {
            width: 48px;
            height: 48px;
            border: 2px solid rgba(255,255,255,0.82);
            border-radius: 999px;
            padding: 0;
            background: rgba(0,0,0,0.3);
            color: #fff;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.32);
        }

        .feed-author-action-avatar {
            width: 100%;
            height: 100%;
            font-size: 16px;
        }

        .feed-author-profile-drawer {
            background: #111320;
            border-left: 0;
            width: min(500px, 100vw);
            overflow: hidden;
        }

        .feed-author-profile-drawer .feed-playlist-header {
            display: none;
        }

        .feed-author-profile-shell {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: #111320;
        }

        .feed-author-profile-hero {
            position: relative;
            height: 198px;
            background: linear-gradient(135deg, #215ecf 0%, #62a8df 48%, #1a1d2b 100%);
            overflow: hidden;
        }

        .feed-author-profile-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--author-hero-image);
            background-size: cover;
            background-position: center;
            filter: blur(10px) saturate(1.1);
            transform: scale(1.08);
            opacity: .72;
        }

        .feed-author-profile-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(17,19,32,0.04) 0%, rgba(17,19,32,0.28) 56%, #111320 100%);
        }

        .feed-author-profile-nav {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 10px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feed-author-profile-iconbar {
            display: flex;
            gap: 10px;
        }

        .feed-author-profile-icon {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.48);
            color: #fff;
            font-size: 17px;
            padding: 0;
        }

        .feed-author-profile-avatar-wrap {
            position: absolute;
            left: 18px;
            bottom: -2px;
            z-index: 3;
            display: flex;
            align-items: flex-end;
            gap: 14px;
        }

        .feed-author-profile-avatar {
            width: 104px;
            height: 104px;
            border: 4px solid #fff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.32);
            background: #303545;
            font-size: 34px;
        }

        .feed-author-profile-titleblock {
            padding-bottom: 18px;
            min-width: 0;
        }

        .feed-author-profile-name {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.4);
        }

        .feed-author-profile-sub {
            color: rgba(255,255,255,0.78);
            font-size: 12px;
            margin-top: 4px;
        }

        .feed-author-profile-header {
            padding: 18px 18px 0;
            border-bottom: 0;
            background: #111320;
        }

        .feed-author-profile-bio {
            margin-top: 12px;
            color: #fff;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-line;
        }

        .feed-author-profile-ip {
            display: inline-flex;
            margin-top: 10px;
            padding: 3px 7px;
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,.72);
            font-size: 11px;
        }

        .feed-author-profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 14px;
        }

        .feed-author-profile-stat {
            background: transparent;
            padding: 0;
            text-align: left;
            border-radius: 0;
        }

        .feed-author-profile-stat strong {
            display: inline;
            font-size: 17px;
            margin-right: 4px;
        }

        .feed-author-profile-stat span {
            display: inline;
            font-size: 12px;
            color: rgba(255,255,255,.8);
        }

        .feed-author-profile-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .feed-author-profile-action {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            padding: 10px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .feed-author-profile-action i {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            flex: 0 0 auto;
        }

        .feed-author-profile-action strong {
            display: block;
            font-size: 13px;
            white-space: nowrap;
        }

        .feed-author-profile-action span {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: rgba(255,255,255,.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feed-author-profile-follow {
            margin-top: 16px;
            width: 100%;
            height: 36px;
            border: 0;
            border-radius: 4px;
            background: #ff2f5f;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .feed-author-profile-tabs {
            margin-top: 18px;
            border-bottom: 1px solid rgba(255,255,255,.1);
            background: #111320;
        }

        .feed-author-profile-tab {
            font-weight: 700;
        }

        .feed-author-profile-tab.active {
            box-shadow: inset 0 -2px 0 #fff;
        }

        .feed-author-profile-body {
            padding: 0;
            overflow: visible;
        }

        .feed-author-work-grid {
            gap: 2px;
            background: #05060a;
        }

        .feed-author-work-card {
            border-radius: 0;
            background: #05060a;
        }

        .feed-author-work-cover {
            aspect-ratio: 1 / 1.22;
        }

        .feed-author-work-title {
            display: none;
        }

        .feed-author-work-type {
            left: 6px;
            top: 6px;
            border-radius: 2px;
            background: #f8e71c;
            color: #111;
            font-weight: 700;
            font-size: 11px;
        }

        .feed-author-work-count {
            position: absolute;
            left: 6px;
            bottom: 6px;
            color: #fff;
            font-size: 12px;
            text-shadow: 0 1px 4px rgba(0,0,0,.7);
        }

        .feed-author-list {
            overflow-y: auto;
            padding: 10px;
            flex: 1;
        }

        .feed-author-item {
            display: block;
            width: 100%;
            border: 0;
            text-align: left;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 9px 10px;
            font-size: 12px;
        }

        .feed-author-item.active {
            background: rgba(86, 156, 255, 0.4);
        }

        .feed-item {
            height: 100%;
            min-height: 100%;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: transform .28s cubic-bezier(.22, .61, .36, 1);
            will-change: transform;
        }

        .feed-slot-prev { transform: translate3d(0, -100%, 0); }
        .feed-slot-current { transform: translate3d(0, 0, 0); }
        .feed-slot-next { transform: translate3d(0, 100%, 0); }

        .feed-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .feed-video-host {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
        }

        .feed-graphic-host {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
            overflow: hidden;
            display: block !important;
        }

        .feed-graphic-slide {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100%;
            height: 100%;
        }

        .feed-graphic-slide.active {
            display: flex !important;
        }

        .feed-graphic-slide:not(.active) {
            display: none !important;
        }

        .feed-graphic-slide img,
        .feed-graphic-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .feed-graphic-progress {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 12px;
            z-index: 2;
            display: flex;
            gap: 4px;
            pointer-events: none;
        }

        .feed-graphic-progress span {
            height: 3px;
            flex: 1;
            border-radius: 999px;
            background: rgba(255,255,255,0.32);
        }

        .feed-graphic-progress span.active {
            background: #fff;
        }

        .feed-graphic-badge {
            position: absolute;
            right: 12px;
            top: 24px;
            z-index: 2;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.52);
            color: #fff;
            font-size: 12px;
            pointer-events: none;
        }

        .feed-video.hide-controls {
            cursor: pointer;
        }

        .feed-overlay {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 14px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.55);
            pointer-events: none;
            z-index: 3;
        }

        .feed-bottom-hover-zone {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 120px;
            z-index: 4;
            pointer-events: auto;
        }

        .feed-custom-controls {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 8;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 10px 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease;
        }

        .feed-item.controls-visible .feed-custom-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .feed-controls-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #fff;
            font-size: 11px;
        }

        .feed-controls-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feed-inline-btn {
            border: 0;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            padding: 0;
        }

        .feed-progress-track {
            position: relative;
            height: 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.22);
            cursor: pointer;
        }

        .feed-progress-buffer,
        .feed-progress-played {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: inherit;
        }

        .feed-progress-buffer {
            background: rgba(255,255,255,0.36);
            width: 0;
        }

        .feed-progress-played {
            background: #ffffff;
            width: 0;
        }

        .feed-progress-thumb {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #fff;
            transform: translate(-50%, -50%);
            left: 0;
            box-shadow: 0 1px 6px rgba(0,0,0,0.32);
        }

        .feed-source-badge {
            position: absolute;
            right: 12px;
            bottom: 20px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.52);
            color: #fff;
            font-size: 12px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            opacity: 0;
            transition: opacity .18s ease;
        }

        .feed-source-badge.visible {
            opacity: 1;
        }

        .feed-source-badge i {
            font-size: 14px;
            line-height: 1;
        }

        .feed-debug-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 7;
            border: 0;
            border-radius: 999px;
            width: 34px;
            height: 34px;
            color: #fff;
            background: rgba(0,0,0,0.45);
            font-size: 14px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .feed-debug-panel {
            position: absolute;
            left: 54px;
            top: 12px;
            z-index: 7;
            min-width: 220px;
            max-width: 280px;
            color: #e5e7eb;
            background: rgba(0,0,0,0.72);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 11px;
            line-height: 1.55;
            white-space: pre-line;
            display: none;
            pointer-events: none;
        }

        .feed-debug-panel.visible {
            display: block;
        }

        .feed-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.35;
            max-width: 90%;
        }

        .feed-meta {
            font-size: 12px;
            opacity: 0.95;
        }

        .feed-author-chip {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
            background: rgba(255,255,255,0.2);
            pointer-events: auto;
            cursor: pointer;
        }

        .feed-author-chip:hover {
            background: rgba(255,255,255,0.32);
        }

        .author-chip {
            margin: 0 8px 8px 0;
        }

        .feed-private-mask {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.42);
            color: #fff;
            font-size: 22px;
            z-index: 2;
            pointer-events: none;
        }
        
        .video-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .video-cover {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .video-cover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-cover img.loaded {
            opacity: 1;
        }
        
        /* 骨架屏样式 */
        .skeleton {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        
        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
        .skeleton.hide {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 隐私保护相关样式 */
        .video-cover.is-private::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        .video-cover.is-private::after {
            content: '\F0425';
            font-family: 'Material Design Icons';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
            z-index: 2;
        }
        
        .video-info {
            padding: 12px;
        }
        
        .video-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 40px;
        }

        .video-title.is-private {
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        
        .video-platform {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0f0f0;
        }
        
        .video-time {
            color: #999;
        }
        
        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
        }
        
        .video-card:hover .video-play {
            opacity: 1;
        }
        
        .video-play i {
            color: #fff;
            font-size: 24px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .feed-page.container-fluid {
                height: 100%;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .video-feed,
            .feed-item {
                min-height: calc(100vh - 98px);
            }

            .feed-custom-controls {
                left: 8px;
                right: 8px;
                bottom: 8px;
                padding: 9px 10px;
            }

            .feed-playlist-drawer {
                width: min(320px, 86vw);
            }
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-container video {
             max-width: 100%;
             max-height: 100%;
             object-fit: contain;
             background: #000;
         }
        @media (max-width: 768px) {
            .layui-layer {
                margin: 10px !important;
            }
            .layui-layer-content {
                overflow: hidden !important;
            }
            .video-container video::-webkit-media-controls-panel {
                background-color: rgba(0,0,0,0.8);
            }
            .table-responsive {
                font-size: 14px;
            }
            
            .btn-group-sm .btn {
                padding: 0.25rem 0.4rem;
                font-size: 12px;
            }
            .playVideo {
                min-width: 32px;
                min-height: 32px;
            }
        }
        
        @media (max-width: 480px) {
             .card-body {
                  padding: 0.75rem;
              }

             .feed-page .card-body {
                  padding: 0 !important;
             }
              
             .table th, .table td {
                  padding: 0.5rem 0.25rem;
              }
         }
        @media (orientation: landscape) and (max-height: 500px) {
            .layui-layer {
                margin: 5px !important;
            }
        }
    </style>
</head>

<script type="text/javascript" src="../static/js/jquery.min.js"></script>
<script type="text/javascript" src="../static/js/bootstrap.min.js"></script>
<script type="text/javascript" src="../static/js/perfect-scrollbar.min.js"></script>
<script type="text/javascript" src="../static/js/main.min.js"></script>
<script src="../static/js/layer/layer.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script>
    var page = 0;
    var isLoading = false;
    var hasMore = true;
    var mediaHomeMode = 'grid';
    var feedObserver = null;
    var feedOrder = 'desc';
    var feedMediaType = 'mixed';
    var feedAuthor = '';
    var feedMuted = true;
    var feedSourceMode = 'prefer_hls';
    var feedAuthorSet = {};
    var feedRandomPool = [];
    var feedRandomCursor = 0;
    var feedRandomLoading = false;
    var feedRandomBatchSize = 8;
    var hlsMap = {};
    var feedLastScrollTop = 0;
    var feedPrewarmDone = {};
    var feedPrewarmPending = {};
    var feedVideoPool = [];
    var feedPrefetchPageThreshold = 5;
    var feedPageSize = 50;
    var feedAbsCounter = 0;
    var feedTrimmedHeadCount = 0;
    var feedScrollDirection = 'down';
    var feedMaxDomItems = 16;
    var feedAllItems = [];
    var feedActiveVideo = null;
    var feedMetrics = {
        playAttempts: 0,
        firstFrameHits: 0,
        fallbackToMp4: 0,
        prewarmHits: 0,
        stallsRecovered: 0
    };
    var feedSessionSeed = '';
    var feedCurrentAbsIndex = -1;
    var feedControlState = {};
    var feedProgressDrag = null;
    var FEED_ORDER_STORAGE_KEY = 'streamv.admin.feedOrder.v2';
    var FEED_MEDIA_TYPE_STORAGE_KEY = 'streamv.admin.feedMediaType';
    var FEED_MUTED_STORAGE_KEY = 'streamv.admin.feedMuted';
    var FEED_AUTONEXT_STORAGE_KEY = 'streamv.admin.feedAutoNext';
    var FEED_PLAYBACK_MODE_STORAGE_KEY = 'streamv.admin.feedPlaybackMode';
    var feedPlaybackMode = 'auto_next';
    var feedFullscreenTransitioning = false;
    var feedFullscreenTarget = null;
    var feedSuppressAutoNextUntil = 0;
    var feedPendingAutoNextIndex = -1;
    var feedAuthorProfileQuery = null;
    var feedAuthorProfileType = '';
    var feedAuthorProfileWorks = [];
    var feedAuthorProfileLoadToken = 0;
    var feedAuthorContext = null;
    var feedAuthorContextTargetKey = '';
    var feedRenderedCenterIndex = -1;
    var feedSwitching = false;
    var feedTouchStartY = null;
    var feedWheelLockUntil = 0;

    function nowMs() {
        return (window.performance && typeof window.performance.now === 'function') ? window.performance.now() : Date.now();
    }

    function shouldLogVideoPerf(videoEl) {
        if (!videoEl) {
            return false;
        }
        if (videoEl._poolRole && videoEl._poolRole !== 'current') {
            return false;
        }
        var ownerIndex = Number(videoEl.getAttribute('data-feed-index') || '-1');
        return ownerIndex < 0 || feedCurrentAbsIndex < 0 || ownerIndex === feedCurrentAbsIndex;
    }

    function markVideoPerf(videoEl, eventName, details) {
        if (!shouldLogVideoPerf(videoEl)) {
            return;
        }
        var startedAt = videoEl._perfStartedAt || nowMs();
        var host = videoEl.parentNode;
        var payload = {
            event: eventName,
            elapsedMs: Math.round(nowMs() - startedAt),
            sourceType: videoEl.getAttribute('data-source-type') || '',
            src: videoEl.currentSrc || videoEl.getAttribute('data-bound-src') || videoEl.src || '',
            fallbackSrc: videoEl.getAttribute('data-fallback') || (host ? (host.getAttribute('data-fallback') || '') : ''),
            didFallback: videoEl.getAttribute('data-did-fallback') === '1',
            readyState: videoEl.readyState,
            networkState: videoEl.networkState,
            feedIndex: videoEl.getAttribute('data-feed-index') || '',
            poolRole: videoEl._poolRole || ''
        };
        if (details) {
            payload.details = details;
        }
        console.log('[AdminIndexPerf] playback', payload);
    }

    function bindVideoPerfEvents(videoEl) {
        if (!videoEl || videoEl._perfEventsBound) {
            return;
        }
        videoEl._perfEventsBound = true;
        ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'playing', 'waiting', 'stalled', 'error'].forEach(function(eventName) {
            videoEl.addEventListener(eventName, function() {
                markVideoPerf(videoEl, eventName);
            });
        });
    }
    
    $(function(){
        var rawMode = $('#mediaHomeMode').val();
        feedMuted = ($('#mediaFeedMuted').val() + '') === 'true';
        try {
            var savedMuted = localStorage.getItem(FEED_MUTED_STORAGE_KEY);
            if (savedMuted === '1' || savedMuted === '0') {
                feedMuted = savedMuted === '1';
            }
        } catch (e) {}
        var rawSourceMode = ($('#mediaFeedSource').val() || '').toString().trim();
        if (['mp4_only', 'hls_only', 'prefer_mp4', 'prefer_hls'].indexOf(rawSourceMode) >= 0) {
            feedSourceMode = rawSourceMode;
        }
        mediaHomeMode = rawMode === 'feed' ? 'feed' : 'grid';
        try {
            var savedOrder = localStorage.getItem(FEED_ORDER_STORAGE_KEY);
            if (savedOrder === 'asc' || savedOrder === 'desc' || savedOrder === 'random') {
                feedOrder = savedOrder;
            }
        } catch (e) {}
        try {
            var savedMediaType = localStorage.getItem(FEED_MEDIA_TYPE_STORAGE_KEY);
            if (savedMediaType === 'mixed' || savedMediaType === 'video' || savedMediaType === 'graphic') {
                feedMediaType = savedMediaType;
            }
        } catch (e) {}
        try {
            var savedPlaybackMode = localStorage.getItem(FEED_PLAYBACK_MODE_STORAGE_KEY);
            if (savedPlaybackMode === 'auto_next' || savedPlaybackMode === 'single_loop') {
                feedPlaybackMode = savedPlaybackMode;
            } else {
                var savedAutoNext = localStorage.getItem(FEED_AUTONEXT_STORAGE_KEY);
                if (savedAutoNext === '1' || savedAutoNext === '0') {
                    feedPlaybackMode = savedAutoNext === '1' ? 'auto_next' : 'single_loop';
                    persistFeedPlaybackMode();
                }
            }
        } catch (e) {}
        feedSessionSeed = String(Date.now()) + '_' + String(Math.floor(Math.random() * 1000000));
        if (mediaHomeMode === 'feed') {
            $('#videoGrid').hide();
            $('#feedControls').css('display', 'flex');
            $('#videoFeed').show();
            ensureFeedSpacer();
            bindFeedScroll();
            bindFeedKeyboard();
            bindFeedWheelNavigation();
            bindFeedControls();
            bindFeedFullscreen();
            updateFeedButtons();
        }
        findList(page);
        
        // 使用节流函数优化滚动事件
        var throttleTimer;
        $(window).scroll(function() {
            if (mediaHomeMode === 'feed') {
                return;
            }
            if (throttleTimer) {
                return;
            }
            
            throttleTimer = setTimeout(function() {
                if ($(window).scrollTop() + $(window).height() > $(document).height() - 100) {
                    if (!isLoading && hasMore) {
                        page++;
                        findList(page);
                    }
                }
                throttleTimer = null;
            }, 200);
        });
    });
    
    function formatTime(time) {
        if(!time) return '';
        return new Date(time).toLocaleString();
    }
    
    function playVideo(videourl, isPrivate) {
    	showVideo(videourl);
    }
    
    function showVideo(videourl) {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var screenWidth = window.innerWidth || document.documentElement.clientWidth;
        var screenHeight = window.innerHeight || document.documentElement.clientHeight;
        var dialogWidth, dialogHeight;
        if (isMobile || screenWidth < 768) {
            dialogWidth = Math.min(screenWidth - 20, screenWidth * 0.95) + 'px';
            dialogHeight = Math.min(screenHeight - 60, screenHeight * 0.8) + 'px';
        } else if (screenWidth < 1200) {
            dialogWidth = Math.min(screenWidth * 0.8, 600) + 'px';
            dialogHeight = Math.min(screenHeight * 0.7, 450) + 'px';
        } else {
            dialogWidth = '800px';
            dialogHeight = '530px';
        }
         var html = '<div class="video-container" style="position: relative; width: 100%; height: 100%; background: #000;">' +
                   '<video data-src="' + videourl + '" ' +
                   'width="100%" height="100%" ' +
                   'controls="controls" ' +
                   'preload="metadata" ' +
                   'playsinline ' +  // iOS内联播放
                   'webkit-playsinline ' +  // 旧版iOS支持
                   'x5-video-player-type="h5" ' +  // 腾讯X5内核优化
                   'x5-video-player-fullscreen="true" ' +  // X5全屏支持
                   'x5-video-orientation="portraint" ' +  // X5竖屏优化
                   'style="object-fit: contain; background: #000;">' +
                   '您的浏览器不支持视频播放' +
                   '</video>' +
                   '</div>';
        
        // 打开弹窗
        var layerIndex = layer.open({
            type: 1,
            skin: 'layui-layer-rim',
            area: [dialogWidth, dialogHeight],
            content: html,
            title: '视频播放',
            maxmin: !isMobile, // 移动端禁用最大化最小化
            resize: !isMobile, // 移动端禁用拖拽调整
            move: !isMobile,   // 移动端禁用拖拽移动
            success: function(layero, index) {
                console.log('视频弹窗打开成功');
                
                // 获取视频元素
                var video = layero.find('video')[0];
                if (video) {
                    setupVideoSource(video, videourl);
                    // 移动端自动播放优化
                    if (isMobile) {
                        // 尝试自动播放（某些浏览器可能阻止）
                        var playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(function(error) {
                                console.log('自动播放被阻止，需要用户手动播放');
                            });
                        }
                    }
                    
                    // 添加视频事件监听
                    video.addEventListener('loadstart', function() {
                        console.log('视频开始加载');
                    });
                    
                    video.addEventListener('error', function(e) {
                        console.log('视频加载错误:', e);
                        layer.msg('视频加载失败，请检查网络连接', {icon: 2});
                    });
                    
                    // 移动端触摸优化
                    if (isMobile) {
                        video.addEventListener('touchstart', function(e) {
                            // 防止双击缩放
                            e.preventDefault();
                        });
                    }
                }
            },
            end: function() {
                console.log('视频弹窗关闭');
            }
        });
    }
    
    
    // 懒加载初始化函数
    function initLazyLoading() {
        // 检查浏览器是否支持Intersection Observer
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        loadImage(img);
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px 0px' // 提前50px开始加载
            });
            
            // 观察所有未加载的图片
            document.querySelectorAll('.lazy-image:not(.loaded)').forEach(function(img) {
                imageObserver.observe(img);
            });
        } else {
            // 降级处理：直接加载所有图片
            document.querySelectorAll('.lazy-image:not(.loaded)').forEach(function(img) {
                loadImage(img);
            });
        }
    }
    
    // 图片加载函数
    function loadImage(img) {
        const $img = $(img);
        const $skeleton = $img.siblings('.skeleton');
        const src = $img.attr('data-src');
        
        if (src) {
            // 创建新的Image对象预加载
            const newImg = new Image();
            
            newImg.onload = function() {
                // 图片加载成功
                $img.attr('src', src).addClass('loaded');
                $skeleton.addClass('hide');
                
                // 延迟移除骨架屏
                setTimeout(function() {
                    $skeleton.remove();
                }, 300);
            };
            
            newImg.onerror = function() {
                // 图片加载失败，使用默认图片
                $img.attr('src', '/static/images/noimage.jpg').addClass('loaded');
                $skeleton.addClass('hide');
                
                setTimeout(function() {
                    $skeleton.remove();
                }, 300);
            };
            
            // 开始加载图片
            newImg.src = src;
        }
    }
    
    function findList(page) {
        if(isLoading || !hasMore) return;
        if (mediaHomeMode === 'feed' && feedAuthorContext) {
            findAuthorContextList(page);
            return;
        }
        isLoading = true;
        $('#loading').show();
        
		var option = mediaHomeMode === 'feed'
			? buildFeedRequestOption(page, feedPageSize)
			: { pageNo: page + 1, pageSize: 25, sortField: 'publishtime', sortOrder: 'desc' };
        option.lite = '1';
        var listRequestStart = nowMs();
        
        $.post(getFeedListEndpoint(), option, function(data, status) {
            if(data.resCode === "000001") {
                var list = data.record.content;
                console.log('[AdminIndexPerf] list response', {
                    elapsedMs: Math.round(nowMs() - listRequestStart),
                    page: page,
                    mode: mediaHomeMode,
                    count: list.length,
                    last: data.record.last,
                    status: status
                });
                
                // 检查是否还有更多数据

    function activateGraphicSlide(host, index) {
        var slides = getGraphicSlides(host);
        var slideCount = Math.max(1, slides.length);
        var nextIndex = Math.max(0, Math.min(index, slideCount - 1));
        var stage = host.querySelector('.feed-graphic-slide');
        if (!stage) {
            return;
        }
        stage.querySelectorAll('video').forEach(function(video) {
            try { video.pause(); } catch (e) {}
        });
        stage.classList.add('active');
        stage.setAttribute('data-slide-index', String(nextIndex));
        stage.setAttribute('data-slide-type', slides[nextIndex] ? slides[nextIndex].type : 'image');
        stage.innerHTML = buildGraphicSlideMediaHtml(slides[nextIndex], host.getAttribute('data-cover') || '/static/images/noimage.jpg');
        Array.prototype.slice.call(host.querySelectorAll('.feed-graphic-progress span')).forEach(function(dot, i) {
            dot.classList.toggle('active', i === nextIndex);
        });
        host.setAttribute('data-current-slide', String(nextIndex));
    }

    function clearGraphicSlideshowTimer(itemEl) {
        if (itemEl && itemEl._graphicSlideTimer) {
            clearTimeout(itemEl._graphicSlideTimer);
            itemEl._graphicSlideTimer = null;
        }
    }

    function runCurrentGraphicSlide(itemEl) {
        var host = itemEl ? itemEl.querySelector('.feed-graphic-host') : null;
        if (!host || itemEl.getAttribute('data-graphic-running') !== '1') {
            return;
        }
        clearGraphicSlideshowTimer(itemEl);
        var slides = getGraphicSlides(host);
        var slideCount = Math.max(1, slides.length);
        var index = Number(host.getAttribute('data-current-slide') || '0');
        if (index < 0 || index >= slideCount) {
            activateGraphicSlide(host, 0);
            index = 0;
        }
        var slide = host.querySelector('.feed-graphic-slide');
        var video = slide ? slide.querySelector('video') : null;
        if (video) {
            video.muted = feedMuted;
            if (video._graphicEndedHandler) {
                video.removeEventListener('ended', video._graphicEndedHandler);
            }
            video._graphicEndedHandler = function() {
                goNextGraphicSlide(itemEl, true);
            };
            video.addEventListener('ended', video._graphicEndedHandler);
            var p = video.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function() {});
            }
            return;
        }
        itemEl._graphicSlideTimer = setTimeout(function() {
            goNextGraphicSlide(itemEl, true);
        }, 4000);
    }

    function goNextGraphicSlide(itemEl, allowAutoNext) {
        var host = itemEl ? itemEl.querySelector('.feed-graphic-host') : null;
        if (!host) {
            return;
        }
        var slides = getGraphicSlides(host);
        var slideCount = Math.max(1, slides.length);
        var current = Number(host.getAttribute('data-current-slide') || '0');
        if (current < slideCount - 1) {
            activateGraphicSlide(host, current + 1);
            runCurrentGraphicSlide(itemEl);
            return;
        }
        if (allowAutoNext) {
            onFeedItemEnded(itemEl);
            return;
        }
        activateGraphicSlide(host, 0);
        runCurrentGraphicSlide(itemEl);
    }

    function goRelativeGraphicSlide(itemEl, delta) {
        var host = itemEl ? itemEl.querySelector('.feed-graphic-host') : null;
        if (!host) {
            return;
        }
        var slides = getGraphicSlides(host);
        var slideCount = Math.max(1, slides.length);
        var current = Number(host.getAttribute('data-current-slide') || '0');
        var next = (current + delta + slideCount) % slideCount;
        activateGraphicSlide(host, next);
        if (itemEl.getAttribute('data-graphic-running') === '1') {
            runCurrentGraphicSlide(itemEl);
        }
    }

    function startGraphicSlideshow(itemEl) {
        if (!itemEl) {
            return;
        }
        var absIndex = Number(itemEl.getAttribute('data-abs-index') || '-1');
        if (absIndex >= 0 && absIndex !== feedCurrentAbsIndex) {
            feedCurrentAbsIndex = absIndex;
            renderFeedPlaylist();
        }
        itemEl.setAttribute('data-graphic-running', '1');
        pauseOtherFeedVideos(null);
        var host = itemEl.querySelector('.feed-graphic-host');
        if (host) {
            activateGraphicSlide(host, Number(host.getAttribute('data-current-slide') || '0'));
        }
        runCurrentGraphicSlide(itemEl);
    }

    function stopGraphicSlideshow(itemEl) {
        if (!itemEl) {
            return;
        }
        itemEl.setAttribute('data-graphic-running', '0');
        clearGraphicSlideshowTimer(itemEl);
        itemEl.querySelectorAll('.feed-graphic-slide video').forEach(function(video) {
            try { video.pause(); } catch (e) {}
        });
    }

    function bindGraphicSlideshowControls() {
        $('#videoFeed .feed-graphic-host').off('click.feedGraphic').on('click.feedGraphic', function(e) {
            if (isControlElement(e.target)) {
                return;
            }
            e.stopPropagation();
            var item = this.closest('.feed-item');
            var rect = this.getBoundingClientRect();
            var delta = e.clientX < rect.left + rect.width / 2 ? -1 : 1;
            goRelativeGraphicSlide(item, delta);
        });
        $('#videoFeed .feed-graphic-item').off('mouseleave.feedGraphic');
    }

    function initFeedAutoPlay() {
        if (!('IntersectionObserver' in window)) {
            return;
        }
        ensureFeedVideoPool();
        if (feedObserver) {
            feedObserver.disconnect();
        }
        feedObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (feedFullscreenTransitioning) {
                    return;
                }
                if (entry.target.getAttribute('data-feed-type') === 'graphic') {
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                        startGraphicSlideshow(entry.target);
                    } else if (entry.intersectionRatio <= 0.15) {
                        stopGraphicSlideshow(entry.target);
                    }
                    return;
                }
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    prewarmFeedWindow(entry.target);
                    var video = entry.target.querySelector('.feed-video');
                    if (!video) {
                        return;
                    }
                    video.muted = feedMuted;
                    playWithSync(video);
                } else if (entry.intersectionRatio <= 0.15) {
                    var video = entry.target.querySelector('.feed-video');
                    if (!video) {
                        return;
                    }
                    video.pause();
                }
            });
        }, {
            threshold: [0.15, 0.3, 0.5, 0.75],
            root: document.getElementById('videoFeed')
        });

        document.querySelectorAll('#videoFeed .feed-item').forEach(function(item) {
            feedObserver.observe(item);
        });

        bindFeedVideoControls();
        bindGraphicSlideshowControls();
    }

    function ensureFeedSpacer() {
        $('#feedTopSpacer').remove();
    }

    function hydrateFeedItems() {
        ensureFeedSpacer();
    }

    function buildFeedSlotHtml(absIndex, slotClass) {
        if (absIndex < 0 || absIndex >= feedAllItems.length) {
            return '';
        }
        var item = feedAllItems[absIndex] || {};
        var isPrivate = (item.privacy || item.videoprivacy) === '1';
        var html = buildFeedItemHtml(item, isPrivate);
        html = html.replace('<div class="feed-item', '<div class="feed-item ' + slotClass);
        html = html.replace('>', ' data-abs-index="' + absIndex + '">');
        return html;
    }

    function renderFeedWindow(options) {
        options = options || {};
        if (mediaHomeMode !== 'feed') {
            return;
        }
        var current = feedCurrentAbsIndex;
        if (current < 0 && feedAllItems.length > 0) {
            current = 0;
            feedCurrentAbsIndex = 0;
        }
        if (current < 0 || current >= feedAllItems.length) {
            $('#videoFeed').empty();
            feedRenderedCenterIndex = -1;
            renderFeedPlaylist();
            return;
        }
        document.querySelectorAll('#videoFeed .feed-item').forEach(function(item) {
            stopGraphicSlideshow(item);
        });
        pauseOtherFeedVideos(null);
        var html = '';
        html += buildFeedSlotHtml(current - 1, 'feed-slot-prev');
        html += buildFeedSlotHtml(current, 'feed-slot-current');
        html += buildFeedSlotHtml(current + 1, 'feed-slot-next');
        $('#videoFeed').html(html);
        feedRenderedCenterIndex = current;
        bindFeedVideoControls();
        bindGraphicSlideshowControls();
        var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        prewarmFeedIndexWindow(items, current, feedScrollDirection);
        renderFeedPlaylist();
        renderFeedAuthorDrawer();
        var remaining = feedAllItems.length - 1 - current;
        if (remaining <= feedPrefetchPageThreshold && hasMore && !isLoading) {
            page++;
            findList(page);
        }
        if (options.forcePlay !== false) {
            playFeedItemByAbsIndex(current, 0);
        }
    }

    function requestMoreFeedForIndex(targetIndex) {
        if (targetIndex < feedAllItems.length || !hasMore || isLoading) {
            return false;
        }
        feedPendingAutoNextIndex = targetIndex;
        page++;
        findList(page);
        return true;
    }

    function switchFeedRelative(delta, options) {
        if (!delta || feedSwitching) {
            return;
        }
        switchFeedTo(feedCurrentAbsIndex + delta, $.extend({ animate: true, forcePlay: true }, options || {}));
    }

    function switchFeedTo(absIndex, options) {
        options = options || {};
        absIndex = Number(absIndex);
        if (!isFinite(absIndex) || absIndex < 0) {
            return;
        }
        if (absIndex >= feedAllItems.length) {
            requestMoreFeedForIndex(absIndex);
            return;
        }
        var oldIndex = feedCurrentAbsIndex;
        var direction = absIndex >= oldIndex ? 'down' : 'up';
        feedScrollDirection = direction;
        if (oldIndex === absIndex) {
            feedCurrentAbsIndex = absIndex;
            renderFeedWindow({ forcePlay: options.forcePlay !== false });
            return;
        }
        var canAnimate = options.animate !== false && Math.abs(absIndex - oldIndex) === 1 && feedRenderedCenterIndex === oldIndex;
        if (canAnimate) {
            var currentItem = document.querySelector('#videoFeed .feed-item[data-abs-index="' + oldIndex + '"]');
            var targetItem = document.querySelector('#videoFeed .feed-item[data-abs-index="' + absIndex + '"]');
            if (currentItem && targetItem) {
                feedSwitching = true;
                stopGraphicSlideshow(currentItem);
                if (direction === 'down') {
                    currentItem.classList.remove('feed-slot-current');
                    currentItem.classList.add('feed-slot-prev');
                    targetItem.classList.remove('feed-slot-next');
                    targetItem.classList.add('feed-slot-current');
                } else {
                    currentItem.classList.remove('feed-slot-current');
                    currentItem.classList.add('feed-slot-next');
                    targetItem.classList.remove('feed-slot-prev');
                    targetItem.classList.add('feed-slot-current');
                }
                feedCurrentAbsIndex = absIndex;
                renderFeedPlaylist();
                setTimeout(function() {
                    feedSwitching = false;
                    renderFeedWindow({ forcePlay: options.forcePlay !== false });
                }, 300);
                return;
            }
        }
        feedCurrentAbsIndex = absIndex;
        renderFeedWindow({ forcePlay: options.forcePlay !== false });
    }

    function onFeedItemEnded(itemEl) {

    }

    function setupVideoSource(videoEl, src, autoPlayWhenReady) {
        if (!videoEl || !src) {
            return;
        }
        bindVideoPerfEvents(videoEl);
        videoEl._perfStartedAt = nowMs();
        videoEl.removeAttribute('data-did-fallback');
        var host = videoEl.parentNode;
        var sourcePack = resolveFeedSource(host, src);
        src = sourcePack.src;
        var sourceType = sourcePack.type;
        var fallback = sourcePack.fallback;
        markVideoPerf(videoEl, 'source-selected', { requestedSrc: src, sourceType: sourceType, fallback: fallback });
        var current = videoEl.getAttribute('data-bound-src');
        if (current === src) {
            if (autoPlayWhenReady) {
                playWithSync(videoEl);
            }
            return;
        }

        if (current && hlsMap[current]) {
            try { hlsMap[current].destroy(); } catch (e) {}
            delete hlsMap[current];
        }

        videoEl.setAttribute('data-bound-src', src);
        ensureFeedControlBinding(videoEl);
        var isM3u8 = sourceType === 'HLS';

        if (videoEl._frameWatchTimer) {
            clearTimeout(videoEl._frameWatchTimer);
            videoEl._frameWatchTimer = null;
        }

        if (!isM3u8) {
            videoEl.setAttribute('data-source-type', 'MP4');
            updateFeedSourceBadge(videoEl, 'MP4');
            videoEl.src = src;
            bindStallGuard(videoEl);
            return;
        }

        function fallbackToMp4(reason) {
            if (!fallback || fallback === src) {
                return;
            }
            feedMetrics.fallbackToMp4++;
            videoEl.setAttribute('data-did-fallback', '1');
            markVideoPerf(videoEl, 'fallback-to-mp4', { reason: reason });
            console.warn('[HLS] fallback to mp4:', reason);
            try {
                if (videoEl._hlsIns) {
                    videoEl._hlsIns.destroy();
                    videoEl._hlsIns = null;
                }
            } catch (e) {}
            videoEl.setAttribute('data-bound-src', fallback);
            videoEl.setAttribute('data-source-type', 'MP4');
            videoEl.src = fallback;
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function(error) {
                    markVideoPerf(videoEl, 'play-rejected', { reason: 'fallback', error: error ? (error.name || error.message || String(error)) : '' });
                });
            }
        }

        if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.setAttribute('data-source-type', 'HLS');
            updateFeedSourceBadge(videoEl, 'HLS');
            videoEl.src = src;
            bindStallGuard(videoEl);
            return;
        }

        if (window.Hls && window.Hls.isSupported()) {
            videoEl.setAttribute('data-source-type', 'HLS');
            updateFeedSourceBadge(videoEl, 'HLS');
            var hls = new window.Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30,
                maxBufferLength: 12,
                maxMaxBufferLength: 20,
                manifestLoadingMaxRetry: 2,
                levelLoadingMaxRetry: 2,
                fragLoadingMaxRetry: 2,
                startFragPrefetch: true,
                capLevelToPlayerSize: true,
                testBandwidth: false
            });
            videoEl._hlsIns = hls;
            hls.loadSource(src);
            hls.attachMedia(videoEl);
            var mediaRecoverCount = 0;
            var networkRecoverCount = 0;
            bindStallGuard(videoEl);

            hls.on(window.Hls.Events.MANIFEST_PARSED, function() {
                markVideoPerf(videoEl, 'manifest-parsed');
                playWithSync(videoEl);
            });

            videoEl._frameWatchTimer = setTimeout(function() {
                var noFrame = !(videoEl.videoWidth > 0 && videoEl.videoHeight > 0);
                var stuck = videoEl.currentTime > 0.8 && noFrame;
                if (stuck) {
                    fallbackToMp4('time moving but no decoded frame');
                }
            }, 4500);

            videoEl.addEventListener('loadeddata', function onLoadedData() {
                if (videoEl._frameWatchTimer) {
                    clearTimeout(videoEl._frameWatchTimer);
                    videoEl._frameWatchTimer = null;
                }
                videoEl.removeEventListener('loadeddata', onLoadedData);
            });
            hls.on(window.Hls.Events.ERROR, function(event, data) {
                if (data && data.fatal) {
                    markVideoPerf(videoEl, 'hls-fatal', { type: data.type, details: data.details });
                    console.warn('[HLS] fatal error', data.type, data.details);
                    if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && networkRecoverCount < 2) {
                        networkRecoverCount++;
                        hls.startLoad();
                        return;
                    }
                    if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && mediaRecoverCount < 2) {
                        mediaRecoverCount++;
                        hls.recoverMediaError();
                        return;
                    }
                    try { hls.destroy(); } catch (e) {}
                    fallbackToMp4('fatal:' + data.type + '/' + data.details);
                }
            });
            hlsMap[src] = hls;
            return;
        }

        videoEl.src = src;
        videoEl.setAttribute('data-source-type', 'MP4');
        updateFeedSourceBadge(videoEl, 'MP4');
        bindStallGuard(videoEl);
    }

    function resolveFeedSource(host, fallbackSrc) {
        var playUrl = host ? (host.getAttribute('data-playurl') || '') : '';
        var mp4 = host ? (host.getAttribute('data-mp4') || '') : '';
        var hls = /\.m3u8(\?|$)/i.test(playUrl) ? playUrl : '';
        if (!mp4) {
            mp4 = host ? (host.getAttribute('data-fallback') || '') : '';
        }
        var mode = feedSourceMode;
        if (mode === 'mp4_only') {
            return { src: mp4 || fallbackSrc, type: 'MP4', fallback: mp4 || fallbackSrc };
        }
        if (mode === 'hls_only') {
            return { src: hls || mp4 || fallbackSrc, type: hls ? 'HLS' : 'MP4', fallback: mp4 || fallbackSrc };
        }
        if (mode === 'prefer_mp4') {
            return { src: mp4 || hls || fallbackSrc, type: (mp4 ? 'MP4' : (hls ? 'HLS' : 'MP4')), fallback: mp4 || fallbackSrc };
        }
        return { src: hls || mp4 || fallbackSrc, type: (hls ? 'HLS' : 'MP4'), fallback: mp4 || fallbackSrc };
    }

    function playWithSync(videoEl) {
        if (!videoEl) {
            return;
        }
        var ownerIndex = Number(videoEl.getAttribute('data-feed-index') || '-1');
        if (ownerIndex >= 0 && ownerIndex !== feedCurrentAbsIndex) {
            feedCurrentAbsIndex = ownerIndex;
            renderFeedPlaylist();
        }
        pauseOtherFeedVideos(videoEl);
        feedMetrics.playAttempts++;
        if (videoEl.readyState >= 2 && (videoEl.videoWidth > 0 || !videoEl.currentSrc || !/\.m3u8(\?|$)/i.test(videoEl.currentSrc))) {
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function(error) {
                    markVideoPerf(videoEl, 'play-rejected', { reason: 'ready-play', error: error ? (error.name || error.message || String(error)) : '' });
                });
            }
            return;
        }
        var once = function() {
            videoEl.removeEventListener('loadeddata', once);
            videoEl.removeEventListener('canplay', once);
            feedMetrics.firstFrameHits++;
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function(error) {
                    markVideoPerf(videoEl, 'play-rejected', { reason: 'deferred-play', error: error ? (error.name || error.message || String(error)) : '' });
                });
            }
        };
        videoEl.addEventListener('loadeddata', once);
        videoEl.addEventListener('canplay', once);
    }

    function pauseOtherFeedVideos(exceptVideo) {
        if (feedActiveVideo && feedActiveVideo !== exceptVideo) {
            try { feedActiveVideo.pause(); } catch (e) {}
            syncFeedControlFromVideo(feedActiveVideo);
        }
        document.querySelectorAll('#videoFeed .feed-video').forEach(function(v) {
            if (v !== exceptVideo && !v.paused) {
                try { v.pause(); } catch (e) {}
                syncFeedControlFromVideo(v);
            }
        });
        feedActiveVideo = exceptVideo;
    }

    function bindStallGuard(videoEl) {
        if (!videoEl || videoEl._stallGuardBound) {
            return;
        }
        videoEl._stallGuardBound = true;
        var lastTime = 0;
        var lastTick = 0;
        videoEl.addEventListener('timeupdate', function() {
            lastTime = videoEl.currentTime || 0;
            lastTick = Date.now();
        });
        videoEl.addEventListener('waiting', function() {
            setTimeout(function() {
                if (videoEl.paused) {
                    return;
                }
                var stuck = (Date.now() - lastTick > 1400);
                if (!stuck) {
                    return;
                }
                if (videoEl._hlsIns && typeof videoEl._hlsIns.recoverMediaError === 'function') {
                    try { videoEl._hlsIns.recoverMediaError(); } catch (e) {}
                }
                feedMetrics.stallsRecovered++;
                try {
                    videoEl.currentTime = Math.max(0, lastTime - 0.02);
                } catch (e) {}
                playWithSync(videoEl);
            }, 800);
        });
    }

    function prewarmFeedWindow(activeItem) {
        if (!activeItem) {
            return;
        }
        var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        var activeIndex = Number(activeItem.getAttribute('data-abs-index') || '-1');
        if (activeIndex < 0) {
            return;
        }
        prewarmFeedIndexWindow(items, activeIndex, feedScrollDirection);
    }

    function prewarmFeedIndexWindow(items, activeIndex, direction) {
        if (!items || activeIndex < 0) {
            return;
        }
        ensureFeedVideoPool();
        var desired = direction === 'up'
            ? [activeIndex - 2, activeIndex - 1, activeIndex, activeIndex + 1]
            : [activeIndex - 1, activeIndex, activeIndex + 1, activeIndex + 2];
        for (var p = 0; p < feedVideoPool.length; p++) {
            var slot = feedVideoPool[p];
            var targetIndex = desired[p];
            var targetItem = null;
            for (var t = 0; t < items.length; t++) {
                if (Number(items[t].getAttribute('data-abs-index') || '-1') === targetIndex) {
                    targetItem = items[t];
                    break;
                }
            }
            if (targetIndex == null || targetIndex < 0 || !targetItem) {
                detachPoolVideo(slot);
                continue;
            }
            mountPoolVideo(slot, targetItem, targetIndex, targetIndex === activeIndex);
        }
        releaseFarFeedPlayers(items, activeIndex, direction);
    }

    function ensureFeedVideoPool() {
        if (feedVideoPool.length > 0) {
            return;
        }
        var roles = ['prev', 'current', 'next', 'next2'];
        for (var i = 0; i < roles.length; i++) {
            var video = document.createElement('video');
            video.className = 'feed-video hide-controls';
            video.setAttribute('preload', 'auto');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.muted = feedMuted;
            video._poolRole = roles[i];
            feedVideoPool.push(video);
        }
    }

    function detachPoolVideo(video) {
        if (!video) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
            video._releaseTimer = null;
        }
        video.pause();
        if (video.parentNode) {
            video.parentNode.removeChild(video);
        }
        if (video._frameWatchTimer) {
            clearTimeout(video._frameWatchTimer);
            video._frameWatchTimer = null;
        }
        var boundSrc = video.getAttribute('data-bound-src');
        if (boundSrc && hlsMap[boundSrc]) {
            try { hlsMap[boundSrc].destroy(); } catch (e) {}
            delete hlsMap[boundSrc];
        }
        video._hlsIns = null;
        video.removeAttribute('data-bound-src');
        video.removeAttribute('src');
        try { video.load(); } catch (e) {}
    }

    function mountPoolVideo(video, itemEl, itemIndex, autoplayNow) {
        if (!video || !itemEl) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
            video._releaseTimer = null;
        }
        var host = itemEl.querySelector('.feed-video-host');
        if (!host) {
            return;
        }
        if (video.parentNode !== host) {
            if (video.parentNode) {
                video.parentNode.removeChild(video);
            }
            host.appendChild(video);
        }
        var src = host.getAttribute('data-src') || '';
        var fallback = host.getAttribute('data-fallback') || '';
        video.setAttribute('data-fallback', fallback);
        video.setAttribute('data-feed-index', String(itemIndex));
        setupVideoSource(video, src, autoplayNow);
        video.muted = feedMuted;
        if (!autoplayNow) {
            prefetchStreamSource(src);
            warmPoolVideo(video, src);
            primeVideoFrame(video);
        }
    }

    function primeVideoFrame(video) {
        if (!video || video._poolRole === 'current') {
            return;
        }
        if (video._framePrimedFor === (video.getAttribute('data-bound-src') || '')) {
            return;
        }
        var once = function() {
            video.removeEventListener('loadeddata', once);
            video.removeEventListener('canplay', once);
            try {
                video.pause();
                video.currentTime = 0;
                video._framePrimedFor = video.getAttribute('data-bound-src') || '';
            } catch (e) {}
        };
        video.addEventListener('loadeddata', once);
        video.addEventListener('canplay', once);
        var p = video.play();
        if (p && typeof p.catch === 'function') {
            p.catch(function() {});
        }
    }

    function warmPoolVideo(video, src) {
        if (!video || !src) {
            return;
        }
        var role = video._poolRole || '';
        if (role !== 'next' && role !== 'next2') {
            return;
        }
        if (!/\.m3u8(\?|$)/i.test(src)) {
            if (role === 'next') {
                try { video.load(); } catch (e) {}
            }
            return;
        }
        if (role === 'next' && video._hlsIns && typeof video._hlsIns.startLoad === 'function') {
            try { video._hlsIns.startLoad(-1); } catch (e) {}
            setTimeout(function() {
                if (video._poolRole === 'next' && video._hlsIns && typeof video._hlsIns.startLoad === 'function') {
                    try { video._hlsIns.startLoad(-1); } catch (e) {}
                }
            }, 260);
        }
    }

    function scheduleReleasePoolVideo(video, delayMs) {
        if (!video) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
        }
        video._releaseTimer = setTimeout(function() {
            detachPoolVideo(video);
        }, delayMs);
    }

    function prefetchStreamSource(src) {
        if (!src || feedPrewarmDone[src] || feedPrewarmPending[src]) {
            return;
        }
        feedPrewarmPending[src] = true;
        feedMetrics.prewarmHits++;
        var isM3u8 = /\.m3u8(\?|$)/i.test(src);
        if (isM3u8) {
            fetch(src, { credentials: 'same-origin' }).then(function(res) {
                return res.text();
            }).then(function(text) {
                var lines = (text || '').split(/\r?\n/);
                var segUrls = [];
                for (var i = 0; i < lines.length; i++) {
                    var line = (lines[i] || '').trim();
                    if (!line || line.charAt(0) === '#') {
                        continue;
                    }
                    segUrls.push(new URL(line, src).toString());
                    if (segUrls.length >= 2) {
                        break;
                    }
                }
                if (segUrls.length === 0) {
                    return null;
                }
                return Promise.all(segUrls.map(function(segUrl) {
                    return fetch(segUrl, { credentials: 'same-origin' });
                }));
            }).then(function() {
                feedPrewarmDone[src] = true;
            }).catch(function() {
            }).finally(function() {
                delete feedPrewarmPending[src];
            });
            return;
        }
        fetch(src, {
            credentials: 'same-origin',
            headers: { 'Range': 'bytes=0-524287' }
        }).then(function() {
            feedPrewarmDone[src] = true;
        }).catch(function() {
        }).finally(function() {
            delete feedPrewarmPending[src];
        });
    }

    function releaseFarFeedPlayers(items, activeIndex, direction) {
        var keepMin = direction === 'up' ? activeIndex - 2 : activeIndex - 1;
        var keepMax = direction === 'up' ? activeIndex + 1 : activeIndex + 2;
        for (var i = 0; i < feedVideoPool.length; i++) {
            var video = feedVideoPool[i];
            if (!video || !video.parentNode) {
                continue;
            }
            var ownerIndex = Number(video.getAttribute('data-feed-index') || '-1');
            if (ownerIndex >= 0 && ownerIndex >= keepMin && ownerIndex <= keepMax) {
                continue;
            }
            if (ownerIndex === keepMin - 1 || ownerIndex === keepMax + 1) {
                scheduleReleasePoolVideo(video, 1200);
                continue;
            }
            detachPoolVideo(video);
        }
    }

    function updateFeedSourceBadge(videoEl, type) {
        if (!videoEl || !videoEl.parentNode) {
            return;
        }
        var badge = videoEl.parentNode.querySelector('.feed-source-badge');
        if (!badge) {
            return;
        }
        var icon = badge.querySelector('i');
        var text = badge.querySelector('span');
        if (text) {
            text.textContent = type === 'HLS' ? 'HLS' : 'MP4';
        }
        if (icon) {
            icon.className = type === 'HLS' ? 'mdi mdi-play-network' : 'mdi mdi-file-video';
        }
    }

        $('#videoFeed').off('scroll');
    }

        return;
