    function bindFeedKeyboard() {
        $(document).on('keydown', function(e) {
            if (mediaHomeMode !== 'feed') {
                return;
            }
            if (feedFullscreenTransitioning) {
                return;
            }
            if (e.key === 'ArrowDown') {
                switchFeedRelative(1, { animate: true, forcePlay: true });
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                switchFeedRelative(-1, { animate: true, forcePlay: true });
                e.preventDefault();
            }
        });
    }

    function bindFeedWheelNavigation() {
        document.addEventListener('wheel', function(e) {
            if (mediaHomeMode !== 'feed' || feedFullscreenTransitioning) {
                return;
            }
            if (isFeedInteractiveTarget(e.target)) {
                return;
            }
            if (Math.abs(e.deltaY) < 20 || Date.now() < feedWheelLockUntil) {
                return;
            }
            feedWheelLockUntil = Date.now() + 360;
            switchFeedRelative(e.deltaY > 0 ? 1 : -1, { animate: true, forcePlay: true });
            e.preventDefault();
        }, { passive: false });

        var feedEl = document.getElementById('videoFeed');
        if (!feedEl) {
            return;
        }
        feedEl.addEventListener('touchstart', function(e) {
            if (!e.touches || !e.touches.length) {
                return;
            }
            feedTouchStartY = e.touches[0].clientY;
        }, { passive: true });
        feedEl.addEventListener('touchend', function(e) {
            if (feedTouchStartY == null || !e.changedTouches || !e.changedTouches.length) {
                feedTouchStartY = null;
                return;
            }
            var delta = feedTouchStartY - e.changedTouches[0].clientY;
            feedTouchStartY = null;
            if (Math.abs(delta) < 45) {
                return;
            }
            switchFeedRelative(delta > 0 ? 1 : -1, { animate: true, forcePlay: true });
        }, { passive: true });
    }

    function loadFeedAuthorProfileWorks() {
        if (!feedAuthorProfileQuery) {
            return;
        }
        var token = ++feedAuthorProfileLoadToken;
        var pageNo = 0;
        var pageSize = 100;
        var allWorks = [];
        feedAuthorProfileWorks = [];
        $('#feedAuthorProfileBody').html('<div style="padding:12px;color:#cbd5e1;">Loading...</div>');

        function loadPage() {
            var option = $.extend({}, feedAuthorProfileQuery, {
                type: feedAuthorProfileType,
                pageNo: pageNo,
                pageSize: pageSize
            });
            $.get('/admin/api/authorProfileWorks', option, function(res) {
                if (token !== feedAuthorProfileLoadToken) {
                    return;
                }
                if (!(res && res.resCode === '000001')) {
                    $('#feedAuthorProfileBody').html('<div style="padding:12px;color:#cbd5e1;">No works</div>');
                    return;
                }
                var record = res.record || {};
                var content = record.content || [];
                allWorks = allWorks.concat(content);
                $('#feedAuthorProfileBody').html('<div style="padding:12px;color:#cbd5e1;">Loading ' + allWorks.length + ' works...</div>');
                if (content.length > 0 && record.last !== true) {
                    pageNo++;
                    loadPage();
                    return;
                }
                feedAuthorProfileWorks = allWorks;
                renderFeedAuthorProfileWorks(feedAuthorProfileWorks);
            }).fail(function() {
                if (token !== feedAuthorProfileLoadToken) {
                    return;
                }
                $('#feedAuthorProfileBody').html('<div style="padding:12px;color:#cbd5e1;">Load failed</div>');
            });
        }

        loadPage();
    }

    function findAuthorContextList(pageNo) {
        if (isLoading || !hasMore || !feedAuthorContext || !feedAuthorContext.query) {
            return;
        }
        isLoading = true;
        $('#loading').show();
        var option = $.extend({}, feedAuthorContext.query, {
            type: feedAuthorContext.type || '',
            pageNo: pageNo,
            pageSize: feedPageSize,
            lite: '1'
        });
        var listRequestStart = nowMs();
        $.get('/admin/api/authorProfileWorks', option, function(res, status) {
            if (res && res.resCode === '000001') {
                var record = res.record || {};
                var list = record.content || [];
                console.log('[AdminIndexPerf] author feed response', {
                    elapsedMs: Math.round(nowMs() - listRequestStart),
                    page: pageNo,
                    count: list.length,
                    last: record.last,
                    status: status
                });
                hasMore = list.length > 0 && record.last !== true;
                if (list.length > 0) {
                    feedAllItems = feedAllItems.concat(list);
                    appendFeedAuthorOptions(list);
                    requestAnimationFrame(function() {
                        hydrateFeedItems();
                        renderFeedPlaylist();
                        renderFeedAuthorDrawer();
                        if (feedAuthorContextTargetKey) {
                            var targetKey = feedAuthorContextTargetKey;
                            var targetIndex = -1;
                            for (var j = 0; j < feedAllItems.length; j++) {
                                if (getFeedItemKey(feedAllItems[j]) === targetKey) {
                                    targetIndex = j;
                                    break;
                                }
                            }
                            feedAuthorContextTargetKey = '';
                            setTimeout(function() {
                                switchFeedTo(targetIndex >= 0 ? targetIndex : 0, { animate: false, forcePlay: true });
                            }, 40);
                        } else if (feedCurrentAbsIndex < 0 && feedAllItems.length > 0) {
                            switchFeedTo(0, { animate: false, forcePlay: true });
                        } else {
                            renderFeedWindow({ forcePlay: false });
                        }
                    });
                }
            } else {
                hasMore = false;
            }
        }).fail(function() {
            hasMore = false;
        }).always(function() {
            isLoading = false;
            $('#loading').hide();
        });
    }

    function compactCount(value) {
        var n = Number(value || 0);
        if (n >= 100000000) {
            return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
        }
        if (n >= 10000) {
            return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
        }
        return String(n);
    }

    function cssUrlEscape(value) {
        return String(value || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function escapeJsString(value) {
        return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, '');
    }

    function buildFeedDebugText(video) {
        var boundSrc = video.getAttribute('data-bound-src') || video.currentSrc || '';
        var type = video.getAttribute('data-source-type') || (/\.m3u8(\?|$)/i.test(boundSrc) ? 'HLS' : 'MP4');
        var lines = [];
        lines.push('Type: ' + type);
        lines.push('ReadyState: ' + video.readyState);
        lines.push('Resolution: ' + (video.videoWidth || 0) + 'x' + (video.videoHeight || 0));
        lines.push('Time: ' + (video.currentTime || 0).toFixed(2));
        lines.push('Buffered: ' + getBufferedEnd(video));
        lines.push('PlaybackRate: ' + (video.playbackRate || 1).toFixed(2));
        lines.push('DroppedFrames: ' + getDroppedFrames(video));
        lines.push('PoolRole: ' + (video._poolRole || '-'));
        lines.push('PlayAttempts: ' + feedMetrics.playAttempts);
        lines.push('FirstFrameHits: ' + feedMetrics.firstFrameHits);
        lines.push('PrewarmHits: ' + feedMetrics.prewarmHits);
        lines.push('StallsRecovered: ' + feedMetrics.stallsRecovered);
        lines.push('FallbackToMp4: ' + feedMetrics.fallbackToMp4);
        return lines.join('\n');
    }

    function getBufferedEnd(video) {
        try {
            if (!video.buffered || video.buffered.length === 0) {
                return '0.00';
            }
            var end = video.buffered.end(video.buffered.length - 1);
            return end.toFixed(2);
        } catch (e) {
            return '0.00';
        }
    }

    function getDroppedFrames(video) {
        try {
            if (!video) {
                return '0';
            }
            if (video.getVideoPlaybackQuality) {
                var q = video.getVideoPlaybackQuality();
                if (q && typeof q.droppedVideoFrames === 'number') {
                    return String(q.droppedVideoFrames);
                }
            }
            if (typeof video.webkitDroppedFrameCount === 'number') {
                return String(video.webkitDroppedFrameCount);
            }
        } catch (e) {}
        return '0';
    }

    function getFeedItemKey(item) {
        if (!item) {
            return '';
        }
        return String(item.mediaKey || item.playurl || item.fallbackUrl || item.videounrealaddr || item.title || item.videoname || item.id || item.videoid || '');
    }

    function getFeedControlState(itemKey) {
        if (!itemKey) {
            return null;
        }
        if (!feedControlState[itemKey]) {
            feedControlState[itemKey] = {
                duration: 0,
                current: 0,
                buffered: 0,
                paused: true
            };
        }
        return feedControlState[itemKey];
    }

    function toFeedClock(raw) {
        var n = Math.max(0, Math.floor(Number(raw || 0)));
        var m = Math.floor(n / 60);
        var s = n % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function renderFeedControlForItem(itemEl) {
        if (!itemEl) {
            return;
        }
        var controls = itemEl.querySelector('.feed-custom-controls');
        if (!controls) {
            return;
        }
        var state = getFeedControlState(controls.getAttribute('data-feed-key') || '');
        if (!state) {
            return;
        }
        var timeEl = controls.querySelector('.feed-controls-time');
        var playBtn = controls.querySelector('.feed-play-toggle i');
        var muteBtn = controls.querySelector('.feed-mute-toggle i');
        var bufferEl = controls.querySelector('.feed-progress-buffer');
        var playedEl = controls.querySelector('.feed-progress-played');
        var thumbEl = controls.querySelector('.feed-progress-thumb');
        var duration = Number(state.duration || 0);
        var current = Math.max(0, Math.min(duration || 0, Number(state.current || 0)));
        var buffered = Math.max(0, Math.min(duration || 0, Number(state.buffered || 0)));
        var playedPercent = duration > 0 ? (current / duration) * 100 : 0;
        var bufferPercent = duration > 0 ? (buffered / duration) * 100 : 0;
        if (timeEl) {
            timeEl.textContent = toFeedClock(current) + ' / ' + toFeedClock(duration);
        }
        if (playBtn) {
            playBtn.className = state.paused ? 'mdi mdi-play' : 'mdi mdi-pause';
        }
        if (muteBtn) {
            muteBtn.className = feedMuted ? 'mdi mdi-volume-off' : 'mdi mdi-volume-high';
        }
        if (bufferEl) {
            bufferEl.style.width = bufferPercent.toFixed(3) + '%';
        }
        if (playedEl) {
            playedEl.style.width = playedPercent.toFixed(3) + '%';
        }
        if (thumbEl) {
            thumbEl.style.left = playedPercent.toFixed(3) + '%';
        }
    }

    function renderAllFeedControls() {
        document.querySelectorAll('#videoFeed .feed-item').forEach(function(item) {
            renderFeedControlForItem(item);
        });
    }

    function syncFeedControlFromVideo(videoEl) {
        if (!videoEl || !videoEl.parentNode) {
            return;
        }
        var itemEl = videoEl.closest('.feed-item');
        if (!itemEl) {
            return;
        }
        var controls = itemEl.querySelector('.feed-custom-controls');
        if (!controls) {
            return;
        }
        var state = getFeedControlState(controls.getAttribute('data-feed-key') || '');
        if (!state) {
            return;
        }
        state.duration = Number(videoEl.duration || state.duration || 0);
        state.current = Number(videoEl.currentTime || 0);
        state.paused = !!videoEl.paused;
        try {
            if (videoEl.buffered && videoEl.buffered.length > 0) {
                state.buffered = Number(videoEl.buffered.end(videoEl.buffered.length - 1) || state.buffered || 0);
            }
        } catch (e) {}
        renderFeedControlForItem(itemEl);
    }

    function ensureFeedControlBinding(videoEl) {
        if (!videoEl || videoEl._customControlBound) {
            return;
        }
        videoEl._customControlBound = true;
        ['loadedmetadata', 'durationchange', 'timeupdate', 'progress', 'play', 'pause', 'volumechange', 'seeked'].forEach(function(evt) {
            videoEl.addEventListener(evt, function() {
                syncFeedControlFromVideo(videoEl);
            });
        });
        videoEl.addEventListener('ended', function() {
            syncFeedControlFromVideo(videoEl);
            if (feedFullscreenTransitioning) {
                return;
            }
            if (Date.now() < feedSuppressAutoNextUntil) {
                return;
            }
            var itemEl = videoEl.closest('.feed-item');
            if (!itemEl) {
                return;
            }
            var currentIndex = Number(videoEl.getAttribute('data-feed-index') || itemEl.getAttribute('data-abs-index') || '-1');
            if (feedCurrentAbsIndex >= 0 && currentIndex !== feedCurrentAbsIndex) {
                return;
            }
            onFeedItemEnded(itemEl);
        });
    }

    function seekFeedByTrack(trackEl, clientX) {
        if (!trackEl) {
            return;
        }
        var itemEl = trackEl.closest('.feed-item');
        if (!itemEl) {
            return;
        }
        var video = itemEl.querySelector('.feed-video');
        if (!video || !video.duration || !isFinite(video.duration)) {
            return;
        }
        var rect = trackEl.getBoundingClientRect();
        var ratio = rect.width > 0 ? Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) : 0;
        try {
            video.currentTime = video.duration * ratio;
            syncFeedControlFromVideo(video);
        } catch (e) {}
    }

    function requestFeedFullscreen(target) {
        if (!target) {
            return;
        }
        if (target.requestFullscreen) {
            target.requestFullscreen();
            return;
        }
        if (target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
            return;
        }
        if (target.msRequestFullscreen) {
            target.msRequestFullscreen();
        }
    }

    function exitFeedFullscreen() {
        if (document.exitFullscreen) {
            document.exitFullscreen();
            return;
        }
        if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
            return;
        }
        if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }

    function isFeedFullscreenTarget(target) {
        var active = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        if (!active || !target) {
            return false;
        }
        return active === target;
    }

    function toggleFeedFullscreen(target) {
        if (!target) {
            return;
        }
        if (isFeedFullscreenTarget(target)) {
            feedSuppressAutoNextUntil = Date.now() + 1200;
            exitFeedFullscreen();
            return;
        }
        feedFullscreenTarget = target;
        requestFeedFullscreen(target);
    }

    function bindFeedFullscreen() {
        ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(function(evt) {
            document.addEventListener(evt, function() {
                feedFullscreenTransitioning = true;
                var active = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                feedFullscreenTarget = active || null;
                if (!active) {
                    feedSuppressAutoNextUntil = Date.now() + 1200;
                    feedFullscreenTarget = null;
                }
                setTimeout(function() {
                    feedFullscreenTransitioning = false;
                }, 420);
                renderAllFeedControls();
            });
        });
    }

    function isControlElement(target) {
        return !!(target && target.closest && target.closest('.feed-custom-controls, .feed-debug-btn, .feed-author-chip, .feed-author-avatar-btn, .feed-author-profile-drawer'));
    }

    function isFeedInteractiveTarget(target) {
        return !!(target && target.closest && target.closest('.feed-custom-controls, .feed-debug-btn, .feed-author-chip, .feed-author-avatar-btn, .feed-author-profile-drawer, .feed-playlist-drawer, .feed-author-drawer, .feed-controls'));
    }

    function persistFeedOrder() {
        try {
            localStorage.setItem(FEED_ORDER_STORAGE_KEY, feedOrder);
        } catch (e) {}
    }

    function persistFeedMediaType() {
        try {
            localStorage.setItem(FEED_MEDIA_TYPE_STORAGE_KEY, feedMediaType);
        } catch (e) {}
    }

    function persistFeedMuted() {
        try {
            localStorage.setItem(FEED_MUTED_STORAGE_KEY, feedMuted ? '1' : '0');
        } catch (e) {}
    }

    function persistFeedPlaybackMode() {
        try {
            localStorage.setItem(FEED_PLAYBACK_MODE_STORAGE_KEY, feedPlaybackMode);
            localStorage.setItem(FEED_AUTONEXT_STORAGE_KEY, feedPlaybackMode === 'auto_next' ? '1' : '0');
        } catch (e) {}
    }

    function reloadFeed() {
        clearFeedAuthorContext();
        resetFeedRenderState();
        if (feedOrder === 'random') {
            feedSessionSeed = String(Date.now()) + '_' + String(Math.floor(Math.random() * 1000000));
        }
        updateFeedButtons();
        findList(page);
    }

    function applyOrderWithoutReload() {
        if (mediaHomeMode !== 'feed') {
            return;
        }
        reloadFeed();
    }

    function buildFeedRequestOption(pageNo, pageSize) {
        var option = {
            pageNo: pageNo + 1,
            pageSize: pageSize || 8
        };
        if (mediaHomeMode === 'feed') {
            option.mediaType = feedMediaType;
            if (feedOrder === 'asc' || feedOrder === 'desc') {
                option.sortField = 'publishtime';
                option.sortOrder = feedOrder;
            } else if (feedOrder === 'random') {
                option.randomMode = '1';
                option.randomSeed = feedSessionSeed;
            }
            if (feedAuthor && feedAuthor.trim() !== '') {
                option.videoauthor = feedAuthor.trim();
            }
        }
        return option;
    }

    function jumpToFeedAbsIndex(absIndex, forcePlay) {
        switchFeedTo(absIndex, { animate: false, forcePlay: forcePlay !== false });
    }

    function playFeedItemByAbsIndex(absIndex, retryCount) {
        var item = document.querySelector('#videoFeed .feed-item[data-abs-index="' + absIndex + '"]');
        if (!item) {
            if ((retryCount || 0) < 20) {
                setTimeout(function() {
                    playFeedItemByAbsIndex(absIndex, (retryCount || 0) + 1);
                }, 160);
            }
            return;
        }
        if (item.getAttribute('data-feed-type') === 'graphic') {
            startGraphicSlideshow(item);
            return;
        }
        var video = item.querySelector('.feed-video');
        if (!video) {
            if ((retryCount || 0) < 20) {
                setTimeout(function() {
                    playFeedItemByAbsIndex(absIndex, (retryCount || 0) + 1);
                }, 160);
            }
            return;
        }
        playWithSync(video);
    }

    function renderFeedPlaylist() {
        if (mediaHomeMode !== 'feed') {
            return;
        }
        var wrap = $('#feedPlaylistList');
        if (!wrap.length) {
            return;
        }
        var html = '';
        for (var i = 0; i < feedAllItems.length; i++) {
            var item = feedAllItems[i] || {};
            var title = item.videoprivacy === '1' ? '******' : (item.videoname || '未命名视频');
            var author = item.videoprivacy === '1' ? '****' : (item.videoauthor || '未知作者');
            var activeCls = i === feedCurrentAbsIndex ? ' active' : '';
            html += '<button type="button" class="feed-playlist-item' + activeCls + '" data-abs="' + i + '">';
            html += '<span>' + escapeHtml((i + 1) + '. ' + title) + '</span>';
            html += '<span class="meta">@' + escapeHtml(author) + '</span>';
            html += '</button>';
        }
        if (!html) {
            html = '<div style="padding:12px;color:#cbd5e1;font-size:12px;">暂无播放项</div>';
        }
        wrap.html(html);
    }

    function renderFeedAuthorDrawer() {
        var wrap = $('#feedAuthorList');
        if (!wrap.length) {
            return;
        }
        var authors = Object.keys(feedAuthorSet).sort();
        var html = '<button type="button" class="feed-author-item' + (!feedAuthor ? ' active' : '') + '" data-author="">全部作者</button>';
        for (var i = 0; i < authors.length; i++) {
            var activeCls = feedAuthor === authors[i] ? ' active' : '';
            html += '<button type="button" class="feed-author-item' + activeCls + '" data-author="' + escapeHtml(authors[i]) + '">' + escapeHtml(authors[i]) + '</button>';
        }
        wrap.html(html);
    }

    function loadRandomPoolAndRender() { return; }

    function renderNextRandomBatch(forceFirst) {
        if (feedOrder !== 'random') {
            return;
        }
        if (forceFirst) {
            $('#videoFeed').empty();
        }
        if (!feedRandomPool || feedRandomPool.length === 0) {
            hasMore = false;
            return;
        }
        var start = feedRandomCursor;
        var end = Math.min(feedRandomCursor + feedRandomBatchSize, feedRandomPool.length);
        if (start >= end) {
            hasMore = false;
            return;
        }
        feedAllItems = feedAllItems.concat(feedRandomPool.slice(start, end));
        feedRandomCursor = end;
        hasMore = feedRandomCursor < feedRandomPool.length;
        requestAnimationFrame(function() {
            if (feedCurrentAbsIndex < 0 && feedAllItems.length > 0) {
                switchFeedTo(0, { animate: false, forcePlay: true });
            } else {
                renderFeedWindow({ forcePlay: false });
            }
        });
    }

    function appendFeedAuthorOptions(list) {
        for (var i = 0; i < list.length; i++) {
            var author = (list[i].videoauthor || '').trim();
            if (!author || feedAuthorSet[author]) {
                continue;
            }
            feedAuthorSet[author] = true;
        }
    }

    function renderFeedPlaylist() {
        if (mediaHomeMode !== 'feed') {
            return;
        }
        var wrap = $('#feedPlaylistList');
        if (!wrap.length) {
            return;
        }
        var html = '';
        for (var i = 0; i < feedAllItems.length; i++) {
            var item = feedAllItems[i] || {};
            var privateItem = (item.privacy || item.videoprivacy) === '1';
            var title = privateItem ? '******' : (item.title || item.videoname || 'Untitled');
            var author = privateItem ? '****' : (item.displayAuthor || item.author || item.videoauthor || 'Unknown');
            var typeLabel = item.type === 'graphic' ? 'Graphic' : 'Video';
            var activeCls = i === feedCurrentAbsIndex ? ' active' : '';
            html += '<button type="button" class="feed-playlist-item' + activeCls + '" data-abs="' + i + '">';
            html += '<span>' + escapeHtml((i + 1) + '. ' + title) + '</span>';
            html += '<span class="meta">[' + typeLabel + '] @' + escapeHtml(author) + '</span>';
            html += '</button>';
        }
        if (!html) {
            html = '<div style="padding:12px;color:#cbd5e1;font-size:12px;">No media</div>';
        }
        wrap.html(html);
    }

    function renderNextRandomBatch(forceFirst) {
        if (feedOrder !== 'random') {
            return;
        }
        if (forceFirst) {
            $('#videoFeed').empty();
        }
        if (!feedRandomPool || feedRandomPool.length === 0) {
            hasMore = false;
            return;
        }
        var start = feedRandomCursor;
        var end = Math.min(feedRandomCursor + feedRandomBatchSize, feedRandomPool.length);
        if (start >= end) {
            hasMore = false;
            return;
        }
        feedAllItems = feedAllItems.concat(feedRandomPool.slice(start, end));
        feedRandomCursor = end;
        hasMore = feedRandomCursor < feedRandomPool.length;
        requestAnimationFrame(function() {
            if (feedCurrentAbsIndex < 0 && feedAllItems.length > 0) {
                switchFeedTo(0, { animate: false, forcePlay: true });
            } else {
                renderFeedWindow({ forcePlay: false });
            }
        });
    }

    function appendFeedAuthorOptions(list) {
        for (var i = 0; i < list.length; i++) {
            var author = (list[i].displayAuthor || list[i].author || list[i].videoauthor || '').trim();
            if (!author || feedAuthorSet[author]) {
                continue;
            }
            feedAuthorSet[author] = true;
        }
    }

    function updateFeedButtons() {
        var orderText = feedOrder === 'asc' ? '顺序' : (feedOrder === 'random' ? '随机' : '倒序');
        $('#feedOrderBtn span').text(orderText);
        var mediaTypeText = feedMediaType === 'video' ? '仅视频' : (feedMediaType === 'graphic' ? '仅图文' : '混合');
        var mediaTypeIcon = feedMediaType === 'video' ? 'mdi mdi-play-box-outline' : (feedMediaType === 'graphic' ? 'mdi mdi-image-multiple-outline' : 'mdi mdi-play-box-multiple-outline');
        $('#feedMediaTypeBtn i').attr('class', mediaTypeIcon);
        $('#feedMediaTypeBtn span').text(mediaTypeText);
        var authorText = feedAuthor && feedAuthor.trim() !== '' ? feedAuthor : '全部';
        if (feedAuthorContext && feedAuthorContext.label) {
            authorText = feedAuthorContext.label;
        }
        if (authorText.length > 4) {
            authorText = authorText.substring(0, 4) + '…';
        }
        $('#feedAuthorBtn span').text(authorText);
        $('#feedMuteBtn i').attr('class', feedMuted ? 'mdi mdi-volume-off' : 'mdi mdi-volume-high');
        $('#feedMuteBtn span').text(feedMuted ? '静音' : '有声');
        var autoNext = feedPlaybackMode === 'auto_next';
        $('#feedAutoNextBtn i').attr('class', autoNext ? 'mdi mdi-skip-next-circle' : 'mdi mdi-repeat-once');
        $('#feedAutoNextBtn span').text(autoNext ? '自动下一条' : '单个循环');
    }

    function escapeHtml(text) {
        return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
</script>
</body>
