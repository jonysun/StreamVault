<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>StreamVault-管理</title>
    <th:block th:insert="~{admin/include/header :: metaHeader}"></th:block>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../static/css/style.min.css" rel="stylesheet">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .feed-page.container-fluid,
        .feed-page .row,
        .feed-page .col-lg-12,
        .feed-page .card,
        .feed-page .card-body {
            height: 100%;
        }

        .feed-page .card {
            margin-bottom: 0;
        }

        .feed-page .card-body {
            position: relative;
            min-height: calc(100vh - 120px);
        }

        .feed-page .video-feed {
            height: 100%;
        }

        .video-feed {
            display: none;
            height: calc(100vh - 120px);
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            background: #000;
        }

        .feed-controls {
            display: none;
            position: absolute;
            right: 12px;
            top: 18px;
            z-index: 6;
            gap: 10px;
            flex-direction: column;
        }

        .feed-control-btn {
            border: 0;
            border-radius: 999px;
            width: 48px;
            height: 48px;
            font-size: 11px;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .feed-control-btn:hover {
            background: rgba(0, 0, 0, 0.62);
        }

        .feed-control-btn i {
            font-size: 18px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .feed-control-btn span {
            line-height: 1;
            transform: scale(0.95);
        }

        .feed-playlist-drawer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 320px;
            z-index: 9;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            transform: translateX(102%);
            transition: transform .2s ease;
            display: flex;
            flex-direction: column;
        }

        .feed-playlist-drawer.open {
            transform: translateX(0);
        }

        .feed-playlist-header {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 14px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .feed-playlist-list {
            overflow-y: auto;
            padding: 10px;
            flex: 1;
        }

        .feed-playlist-item {
            display: block;
            width: 100%;
            border: 0;
            text-align: left;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 9px 10px;
            font-size: 12px;
        }

        .feed-playlist-item.active {
            background: rgba(86, 156, 255, 0.4);
        }

        .feed-playlist-item .meta {
            display: block;
            opacity: .75;
            margin-top: 4px;
            font-size: 11px;
        }

        .feed-item {
            height: calc(100vh - 120px);
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .feed-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .feed-video-host {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
        }

        .feed-video.hide-controls {
            cursor: pointer;
        }

        .feed-video.hide-controls::-webkit-media-controls {
            opacity: 0;
            transition: opacity .18s ease;
        }

        .feed-video.hide-controls.controls-visible::-webkit-media-controls {
            opacity: 1;
        }

        .feed-overlay {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 14px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.55);
            pointer-events: none;
            z-index: 3;
        }

        .feed-bottom-hover-zone {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 92px;
            z-index: 4;
            pointer-events: none;
        }

        .feed-source-badge {
            position: absolute;
            right: 12px;
            bottom: 20px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.52);
            color: #fff;
            font-size: 12px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            opacity: 0;
            transition: opacity .18s ease;
        }

        .feed-source-badge.visible {
            opacity: 1;
        }

        .feed-source-badge i {
            font-size: 14px;
            line-height: 1;
        }

        .feed-debug-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 7;
            border: 0;
            border-radius: 999px;
            width: 34px;
            height: 34px;
            color: #fff;
            background: rgba(0,0,0,0.45);
            font-size: 14px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .feed-debug-panel {
            position: absolute;
            right: 12px;
            top: 52px;
            z-index: 7;
            min-width: 220px;
            max-width: 280px;
            color: #e5e7eb;
            background: rgba(0,0,0,0.72);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 11px;
            line-height: 1.55;
            white-space: pre-line;
            display: none;
            pointer-events: none;
        }

        .feed-debug-panel.visible {
            display: block;
        }

        .feed-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.35;
            max-width: 90%;
        }

        .feed-meta {
            font-size: 12px;
            opacity: 0.95;
        }

        .feed-author-chip {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
            background: rgba(255,255,255,0.2);
            pointer-events: auto;
            cursor: pointer;
        }

        .feed-author-chip:hover {
            background: rgba(255,255,255,0.32);
        }

        .author-sheet {
            padding: 12px;
            max-height: 62vh;
            overflow: auto;
            background: #fff;
        }

        .author-sheet-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .author-chip {
            margin: 0 8px 8px 0;
        }

        .feed-private-mask {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.42);
            color: #fff;
            font-size: 22px;
            z-index: 2;
            pointer-events: none;
        }
        
        .video-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .video-cover {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .video-cover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-cover img.loaded {
            opacity: 1;
        }
        
        /* 骨架屏样式 */
        .skeleton {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        
        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
        .skeleton.hide {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 隐私保护相关样式 */
        .video-cover.is-private::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
        }

        .video-cover.is-private::after {
            content: '\F0425';
            font-family: 'Material Design Icons';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #666;
            z-index: 2;
        }
        
        .video-info {
            padding: 12px;
        }
        
        .video-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 40px;
        }

        .video-title.is-private {
            color: transparent;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #666;
        }
        
        .video-platform {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0f0f0;
        }
        
        .video-time {
            color: #999;
        }
        
        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
        }
        
        .video-card:hover .video-play {
            opacity: 1;
        }
        
        .video-play i {
            color: #fff;
            font-size: 24px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .video-feed,
            .feed-item {
                height: calc(100vh - 98px);
            }
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-container video {
             max-width: 100%;
             max-height: 100%;
             object-fit: contain;
             background: #000;
         }
        @media (max-width: 768px) {
            .layui-layer {
                margin: 10px !important;
            }
            .layui-layer-content {
                overflow: hidden !important;
            }
            .video-container video::-webkit-media-controls-panel {
                background-color: rgba(0,0,0,0.8);
            }
            .table-responsive {
                font-size: 14px;
            }
            
            .btn-group-sm .btn {
                padding: 0.25rem 0.4rem;
                font-size: 12px;
            }
            .playVideo {
                min-width: 32px;
                min-height: 32px;
            }
        }
        
        @media (max-width: 480px) {
             .card-body {
                 padding: 0.75rem;
             }
             
             .table th, .table td {
                 padding: 0.5rem 0.25rem;
             }
         }
        @media (orientation: landscape) and (max-height: 500px) {
            .layui-layer {
                margin: 5px !important;
            }
        }
    </style>
</head>

<body>
<div class="lyear-layout-web">
    <div class="lyear-layout-container">
        <div th:insert="~{admin/include/common :: headermenu}"></div>
        
        <main class="lyear-layout-content">
            <div class="container-fluid feed-page">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body p-0">
                                <input type="hidden" id="mediaHomeMode" th:value="${T(com.flower.spirit.config.Global).mediaHomeMode}" />
                                <input type="hidden" id="mediaFeedMuted" th:value="${T(com.flower.spirit.config.Global).mediaFeedMuted}" />
                                <input type="hidden" id="mediaFeedSource" th:value="${T(com.flower.spirit.config.Global).mediaFeedSource}" />
                                <div class="feed-controls" id="feedControls">
                                    <button type="button" class="feed-control-btn" id="feedOrderBtn" title="播放顺序">
                                        <i class="mdi mdi-sort"></i><span>倒序</span>
                                    </button>
                                    <button type="button" class="feed-control-btn" id="feedAuthorBtn" title="作者筛选">
                                        <i class="mdi mdi-account"></i><span>全部</span>
                                    </button>
                                    <button type="button" class="feed-control-btn" id="feedMuteBtn" title="静音">
                                        <i class="mdi mdi-volume-off"></i><span>静音</span>
                                    </button>
                                    <button type="button" class="feed-control-btn" id="feedPlaylistBtn" title="播放列表">
                                        <i class="mdi mdi-format-list-bulleted"></i><span>列表</span>
                                    </button>
                                </div>
                                <div class="video-grid" id="videoGrid">
                                </div>
                                <div class="video-feed" id="videoFeed">
                                </div>
                                <div class="feed-playlist-drawer" id="feedPlaylistDrawer">
                                    <div class="feed-playlist-header">播放列表</div>
                                    <div class="feed-playlist-list" id="feedPlaylistList"></div>
                                </div>
                                <div class="loading" id="loading" style="display: none;">
                                    <i class="mdi mdi-loading mdi-spin"></i> 加载中...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="text/javascript" src="../static/js/jquery.min.js"></script>
<script type="text/javascript" src="../static/js/bootstrap.min.js"></script>
<script type="text/javascript" src="../static/js/perfect-scrollbar.min.js"></script>
<script type="text/javascript" src="../static/js/main.min.js"></script>
<script src="../static/js/layer/layer.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script>
    var page = 0;
    var isLoading = false;
    var hasMore = true;
    var mediaHomeMode = 'grid';
    var feedObserver = null;
    var feedOrder = 'desc';
    var feedAuthor = '';
    var feedMuted = true;
    var feedSourceMode = 'prefer_hls';
    var feedAuthorSet = {};
    var authorSheetIndex = -1;
    var feedRandomPool = [];
    var feedRandomCursor = 0;
    var feedRandomLoading = false;
    var feedRandomBatchSize = 8;
    var hlsMap = {};
    var feedLastScrollTop = 0;
    var feedPrewarmDone = {};
    var feedPrewarmPending = {};
    var feedVideoPool = [];
    var feedPrefetchPageThreshold = 5;
    var feedPageSize = 50;
    var feedAbsCounter = 0;
    var feedTrimmedHeadCount = 0;
    var feedScrollDirection = 'down';
    var feedMaxDomItems = 16;
    var feedAllItems = [];
    var feedAllLoaded = false;
    var feedFullScanInProgress = false;
    var feedActiveVideo = null;
    var feedMetrics = {
        playAttempts: 0,
        firstFrameHits: 0,
        fallbackToMp4: 0,
        prewarmHits: 0,
        stallsRecovered: 0
    };
    var feedSessionSeed = '';
    var feedCurrentAbsIndex = -1;
    
    $(function(){
        var rawMode = $('#mediaHomeMode').val();
        feedMuted = ($('#mediaFeedMuted').val() + '') === 'true';
        var rawSourceMode = ($('#mediaFeedSource').val() || '').toString().trim();
        if (['mp4_only', 'hls_only', 'prefer_mp4', 'prefer_hls'].indexOf(rawSourceMode) >= 0) {
            feedSourceMode = rawSourceMode;
        }
        mediaHomeMode = rawMode === 'feed' ? 'feed' : 'grid';
        feedSessionSeed = String(Date.now()) + '_' + String(Math.floor(Math.random() * 1000000));
        if (mediaHomeMode === 'feed') {
            $('#videoGrid').hide();
            $('#feedControls').css('display', 'flex');
            $('#videoFeed').show();
            ensureFeedSpacer();
            bindFeedScroll();
            bindFeedKeyboard();
            bindFeedWheelNavigation();
            bindFeedControls();
            updateFeedButtons();
        }
        findList(page);
        
        // 使用节流函数优化滚动事件
        var throttleTimer;
        $(window).scroll(function() {
            if (throttleTimer) {
                return;
            }
            
            throttleTimer = setTimeout(function() {
                if ($(window).scrollTop() + $(window).height() > $(document).height() - 100) {
                    if (!isLoading && hasMore) {
                        page++;
                        findList(page);
                    }
                }
                throttleTimer = null;
            }, 200);
        });
    });
    
    function formatTime(time) {
        if(!time) return '';
        return new Date(time).toLocaleString();
    }
    
    function playVideo(videourl, isPrivate) {
    	showVideo(videourl);
    }
    
    function showVideo(videourl) {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var screenWidth = window.innerWidth || document.documentElement.clientWidth;
        var screenHeight = window.innerHeight || document.documentElement.clientHeight;
        var dialogWidth, dialogHeight;
        if (isMobile || screenWidth < 768) {
            dialogWidth = Math.min(screenWidth - 20, screenWidth * 0.95) + 'px';
            dialogHeight = Math.min(screenHeight - 60, screenHeight * 0.8) + 'px';
        } else if (screenWidth < 1200) {
            dialogWidth = Math.min(screenWidth * 0.8, 600) + 'px';
            dialogHeight = Math.min(screenHeight * 0.7, 450) + 'px';
        } else {
            dialogWidth = '800px';
            dialogHeight = '530px';
        }
         var html = '<div class="video-container" style="position: relative; width: 100%; height: 100%; background: #000;">' +
                   '<video data-src="' + videourl + '" ' +
                   'width="100%" height="100%" ' +
                   'controls="controls" ' +
                   'preload="metadata" ' +
                   'playsinline ' +  // iOS内联播放
                   'webkit-playsinline ' +  // 旧版iOS支持
                   'x5-video-player-type="h5" ' +  // 腾讯X5内核优化
                   'x5-video-player-fullscreen="true" ' +  // X5全屏支持
                   'x5-video-orientation="portraint" ' +  // X5竖屏优化
                   'style="object-fit: contain; background: #000;">' +
                   '您的浏览器不支持视频播放' +
                   '</video>' +
                   '</div>';
        
        // 打开弹窗
        var layerIndex = layer.open({
            type: 1,
            skin: 'layui-layer-rim',
            area: [dialogWidth, dialogHeight],
            content: html,
            title: '视频播放',
            maxmin: !isMobile, // 移动端禁用最大化最小化
            resize: !isMobile, // 移动端禁用拖拽调整
            move: !isMobile,   // 移动端禁用拖拽移动
            success: function(layero, index) {
                console.log('视频弹窗打开成功');
                
                // 获取视频元素
                var video = layero.find('video')[0];
                if (video) {
                    setupVideoSource(video, videourl);
                    // 移动端自动播放优化
                    if (isMobile) {
                        // 尝试自动播放（某些浏览器可能阻止）
                        var playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(function(error) {
                                console.log('自动播放被阻止，需要用户手动播放');
                            });
                        }
                    }
                    
                    // 添加视频事件监听
                    video.addEventListener('loadstart', function() {
                        console.log('视频开始加载');
                    });
                    
                    video.addEventListener('error', function(e) {
                        console.log('视频加载错误:', e);
                        layer.msg('视频加载失败，请检查网络连接', {icon: 2});
                    });
                    
                    // 移动端触摸优化
                    if (isMobile) {
                        video.addEventListener('touchstart', function(e) {
                            // 防止双击缩放
                            e.preventDefault();
                        });
                    }
                }
            },
            end: function() {
                console.log('视频弹窗关闭');
            }
        });
    }
    
    
    // 懒加载初始化函数
    function initLazyLoading() {
        // 检查浏览器是否支持Intersection Observer
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        loadImage(img);
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '50px 0px' // 提前50px开始加载
            });
            
            // 观察所有未加载的图片
            document.querySelectorAll('.lazy-image:not(.loaded)').forEach(function(img) {
                imageObserver.observe(img);
            });
        } else {
            // 降级处理：直接加载所有图片
            document.querySelectorAll('.lazy-image:not(.loaded)').forEach(function(img) {
                loadImage(img);
            });
        }
    }
    
    // 图片加载函数
    function loadImage(img) {
        const $img = $(img);
        const $skeleton = $img.siblings('.skeleton');
        const src = $img.attr('data-src');
        
        if (src) {
            // 创建新的Image对象预加载
            const newImg = new Image();
            
            newImg.onload = function() {
                // 图片加载成功
                $img.attr('src', src).addClass('loaded');
                $skeleton.addClass('hide');
                
                // 延迟移除骨架屏
                setTimeout(function() {
                    $skeleton.remove();
                }, 300);
            };
            
            newImg.onerror = function() {

    function initFeedAutoPlay() {
        if (!('IntersectionObserver' in window)) {
            return;
        }
        ensureFeedVideoPool();
        if (feedObserver) {
            feedObserver.disconnect();
        }
        feedObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    prewarmFeedWindow(entry.target);
                    var video = entry.target.querySelector('.feed-video');
                    if (!video) {
                        return;
                    }
                    video.muted = feedMuted;
                    playWithSync(video);
                } else if (entry.intersectionRatio <= 0.15) {
                    var video = entry.target.querySelector('.feed-video');
                    if (!video) {
                        return;
                    }
                    video.pause();
                }
            });
        }, {
            threshold: [0.15, 0.3, 0.5, 0.75],
            root: document.getElementById('videoFeed')
        });

        document.querySelectorAll('#videoFeed .feed-item').forEach(function(item) {
            feedObserver.observe(item);
        });

        bindFeedVideoControls();
    }

            if (badge) {

    function setupVideoSource(videoEl, src, autoPlayWhenReady) {
        if (!videoEl || !src) {
            return;
        }
        var host = videoEl.parentNode;
        var sourcePack = resolveFeedSource(host, src);
        src = sourcePack.src;
        var sourceType = sourcePack.type;
        var fallback = sourcePack.fallback;
        var current = videoEl.getAttribute('data-bound-src');
        if (current === src) {
            if (autoPlayWhenReady) {
                playWithSync(videoEl);
            }
            return;
        }

        if (current && hlsMap[current]) {
            try { hlsMap[current].destroy(); } catch (e) {}
            delete hlsMap[current];
        }

        videoEl.setAttribute('data-bound-src', src);
        var isM3u8 = sourceType === 'HLS';

        if (videoEl._frameWatchTimer) {
            clearTimeout(videoEl._frameWatchTimer);
            videoEl._frameWatchTimer = null;
        }

        if (!isM3u8) {
            videoEl.setAttribute('data-source-type', 'MP4');
            updateFeedSourceBadge(videoEl, 'MP4');
            videoEl.src = src;
            bindStallGuard(videoEl);
            return;
        }

        function fallbackToMp4(reason) {
            if (!fallback || fallback === src) {
                return;
            }
            feedMetrics.fallbackToMp4++;
            console.warn('[HLS] fallback to mp4:', reason);
            try {
                if (videoEl._hlsIns) {
                    videoEl._hlsIns.destroy();
                    videoEl._hlsIns = null;
                }
            } catch (e) {}
            videoEl.setAttribute('data-bound-src', fallback);
            videoEl.setAttribute('data-source-type', 'MP4');
            videoEl.src = fallback;
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function() {});
            }
        }

        if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.setAttribute('data-source-type', 'HLS');
            updateFeedSourceBadge(videoEl, 'HLS');
            videoEl.src = src;
            bindStallGuard(videoEl);
            return;
        }

        if (window.Hls && window.Hls.isSupported()) {
            videoEl.setAttribute('data-source-type', 'HLS');
            updateFeedSourceBadge(videoEl, 'HLS');
            var hls = new window.Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30,
                maxBufferLength: 12,
                maxMaxBufferLength: 20,
                manifestLoadingMaxRetry: 2,
                levelLoadingMaxRetry: 2,
                fragLoadingMaxRetry: 2,
                startFragPrefetch: true,
                capLevelToPlayerSize: true,
                testBandwidth: false
            });
            videoEl._hlsIns = hls;
            hls.loadSource(src);
            hls.attachMedia(videoEl);
            var mediaRecoverCount = 0;
            var networkRecoverCount = 0;
            bindStallGuard(videoEl);

            hls.on(window.Hls.Events.MANIFEST_PARSED, function() {
                playWithSync(videoEl);
            });

            videoEl._frameWatchTimer = setTimeout(function() {
                var noFrame = !(videoEl.videoWidth > 0 && videoEl.videoHeight > 0);
                var stuck = videoEl.currentTime > 0.8 && noFrame;
                if (stuck) {
                    fallbackToMp4('time moving but no decoded frame');
                }
            }, 4500);

            videoEl.addEventListener('loadeddata', function onLoadedData() {
                if (videoEl._frameWatchTimer) {
                    clearTimeout(videoEl._frameWatchTimer);
                    videoEl._frameWatchTimer = null;
                }
                videoEl.removeEventListener('loadeddata', onLoadedData);
            });
            hls.on(window.Hls.Events.ERROR, function(event, data) {
                if (data && data.fatal) {
                    console.warn('[HLS] fatal error', data.type, data.details);
                    if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && networkRecoverCount < 2) {
                        networkRecoverCount++;
                        hls.startLoad();
                        return;
                    }
                    if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && mediaRecoverCount < 2) {
                        mediaRecoverCount++;
                        hls.recoverMediaError();
                        return;
                    }
                    try { hls.destroy(); } catch (e) {}
                    fallbackToMp4('fatal:' + data.type + '/' + data.details);
                }
            });
            hlsMap[src] = hls;
            return;
        }

        videoEl.src = src;
        videoEl.setAttribute('data-source-type', 'MP4');
        updateFeedSourceBadge(videoEl, 'MP4');
        bindStallGuard(videoEl);
    }

    function resolveFeedSource(host, fallbackSrc) {
        var playUrl = host ? (host.getAttribute('data-playurl') || '') : '';
        var mp4 = host ? (host.getAttribute('data-mp4') || '') : '';
        var hls = /\.m3u8(\?|$)/i.test(playUrl) ? playUrl : '';
        if (!mp4) {
            mp4 = host ? (host.getAttribute('data-fallback') || '') : '';
        }
        var mode = feedSourceMode;
        if (mode === 'mp4_only') {
            return { src: mp4 || fallbackSrc, type: 'MP4', fallback: mp4 || fallbackSrc };
        }
        if (mode === 'hls_only') {
            return { src: hls || mp4 || fallbackSrc, type: hls ? 'HLS' : 'MP4', fallback: mp4 || fallbackSrc };
        }
        if (mode === 'prefer_mp4') {
            return { src: mp4 || hls || fallbackSrc, type: (mp4 ? 'MP4' : (hls ? 'HLS' : 'MP4')), fallback: mp4 || fallbackSrc };
        }
        return { src: hls || mp4 || fallbackSrc, type: (hls ? 'HLS' : 'MP4'), fallback: mp4 || fallbackSrc };
    }

    function playWithSync(videoEl) {
        if (!videoEl) {
            return;
        }
        var ownerIndex = Number(videoEl.getAttribute('data-feed-index') || '-1');
        if (ownerIndex >= 0 && ownerIndex !== feedCurrentAbsIndex) {
            feedCurrentAbsIndex = ownerIndex;
            renderFeedPlaylist();
        }
        pauseOtherFeedVideos(videoEl);
        feedMetrics.playAttempts++;
        if (videoEl.readyState >= 2 && (videoEl.videoWidth > 0 || !videoEl.currentSrc || !/\.m3u8(\?|$)/i.test(videoEl.currentSrc))) {
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function() {});
            }
            return;
        }
        var once = function() {
            videoEl.removeEventListener('loadeddata', once);
            videoEl.removeEventListener('canplay', once);
            feedMetrics.firstFrameHits++;
            var p = videoEl.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function() {});
            }
        };
        videoEl.addEventListener('loadeddata', once);
        videoEl.addEventListener('canplay', once);
    }

    function pauseOtherFeedVideos(exceptVideo) {
        if (feedActiveVideo && feedActiveVideo !== exceptVideo) {
            try { feedActiveVideo.pause(); } catch (e) {}
        }
        document.querySelectorAll('#videoFeed .feed-video').forEach(function(v) {
            if (v !== exceptVideo && !v.paused) {
                try { v.pause(); } catch (e) {}
            }
        });
        feedActiveVideo = exceptVideo;
    }

    function bindStallGuard(videoEl) {
        if (!videoEl || videoEl._stallGuardBound) {
            return;
        }
        videoEl._stallGuardBound = true;
        var lastTime = 0;
        var lastTick = 0;
        videoEl.addEventListener('timeupdate', function() {
            lastTime = videoEl.currentTime || 0;
            lastTick = Date.now();
        });
        videoEl.addEventListener('waiting', function() {
            setTimeout(function() {
                if (videoEl.paused) {
                    return;
                }
                var stuck = (Date.now() - lastTick > 1400);
                if (!stuck) {
                    return;
                }
                if (videoEl._hlsIns && typeof videoEl._hlsIns.recoverMediaError === 'function') {
                    try { videoEl._hlsIns.recoverMediaError(); } catch (e) {}
                }
                feedMetrics.stallsRecovered++;
                try {
                    videoEl.currentTime = Math.max(0, lastTime - 0.02);
                } catch (e) {}
                playWithSync(videoEl);
            }, 800);
        });
    }

    function prewarmFeedWindow(activeItem) {
        if (!activeItem) {
            return;
        }
        var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        var activeIndex = Number(activeItem.getAttribute('data-abs-index') || '-1');
        if (activeIndex < 0) {
            return;
        }
        prewarmFeedIndexWindow(items, activeIndex, feedScrollDirection);
    }

    function prewarmFeedIndexWindow(items, activeIndex, direction) {
        if (!items || activeIndex < 0) {
            return;
        }
        ensureFeedVideoPool();
        var desired = direction === 'up'
            ? [activeIndex - 2, activeIndex - 1, activeIndex, activeIndex + 1]
            : [activeIndex - 1, activeIndex, activeIndex + 1, activeIndex + 2];
        for (var p = 0; p < feedVideoPool.length; p++) {
            var slot = feedVideoPool[p];
            var targetIndex = desired[p];
            var targetItem = null;
            for (var t = 0; t < items.length; t++) {
                if (Number(items[t].getAttribute('data-abs-index') || '-1') === targetIndex) {
                    targetItem = items[t];
                    break;
                }
            }
            if (targetIndex == null || targetIndex < 0 || !targetItem) {
                detachPoolVideo(slot);
                continue;
            }
            mountPoolVideo(slot, targetItem, targetIndex, targetIndex === activeIndex);
        }
        releaseFarFeedPlayers(items, activeIndex, direction);
    }

    function ensureFeedVideoPool() {
        if (feedVideoPool.length > 0) {
            return;
        }
        var roles = ['prev', 'current', 'next', 'next2'];
        for (var i = 0; i < roles.length; i++) {
            var video = document.createElement('video');
            video.className = 'feed-video';
            video.setAttribute('preload', 'auto');
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.controls = false;
            video.muted = feedMuted;
            video._poolRole = roles[i];
            feedVideoPool.push(video);
        }
    }

    function detachPoolVideo(video) {
        if (!video) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
            video._releaseTimer = null;
        }
        video.pause();
        if (video.parentNode) {
            video.parentNode.removeChild(video);
        }
        if (video._frameWatchTimer) {
            clearTimeout(video._frameWatchTimer);
            video._frameWatchTimer = null;
        }
        var boundSrc = video.getAttribute('data-bound-src');
        if (boundSrc && hlsMap[boundSrc]) {
            try { hlsMap[boundSrc].destroy(); } catch (e) {}
            delete hlsMap[boundSrc];
        }
        video._hlsIns = null;
        video.removeAttribute('data-bound-src');
        video.removeAttribute('src');
        try { video.load(); } catch (e) {}
    }

    function mountPoolVideo(video, itemEl, itemIndex, autoplayNow) {
        if (!video || !itemEl) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
            video._releaseTimer = null;
        }
        var host = itemEl.querySelector('.feed-video-host');
        if (!host) {
            return;
        }
        if (video.parentNode !== host) {
            if (video.parentNode) {
                video.parentNode.removeChild(video);
            }
            host.appendChild(video);
        }
        var src = host.getAttribute('data-src') || '';
        var fallback = host.getAttribute('data-fallback') || '';
        video.setAttribute('data-fallback', fallback);
        video.setAttribute('data-feed-index', String(itemIndex));
        setupVideoSource(video, src, autoplayNow);
        video.muted = feedMuted;
        if (!autoplayNow) {
            prefetchStreamSource(src);
            warmPoolVideo(video, src);
            primeVideoFrame(video);
        }
    }

    function primeVideoFrame(video) {
        if (!video || video._poolRole === 'current') {
            return;
        }
        if (video._framePrimedFor === (video.getAttribute('data-bound-src') || '')) {
            return;
        }
        var once = function() {
            video.removeEventListener('loadeddata', once);
            video.removeEventListener('canplay', once);
            try {
                video.pause();
                video.currentTime = 0;
                video._framePrimedFor = video.getAttribute('data-bound-src') || '';
            } catch (e) {}
        };
        video.addEventListener('loadeddata', once);
        video.addEventListener('canplay', once);
        var p = video.play();
        if (p && typeof p.catch === 'function') {
            p.catch(function() {});
        }
    }

    function warmPoolVideo(video, src) {
        if (!video || !src) {
            return;
        }
        var role = video._poolRole || '';
        if (role !== 'next' && role !== 'next2') {
            return;
        }
        if (!/\.m3u8(\?|$)/i.test(src)) {
            if (role === 'next') {
                try { video.load(); } catch (e) {}
            }
            return;
        }
        if (role === 'next' && video._hlsIns && typeof video._hlsIns.startLoad === 'function') {
            try { video._hlsIns.startLoad(-1); } catch (e) {}
            setTimeout(function() {
                if (video._poolRole === 'next' && video._hlsIns && typeof video._hlsIns.startLoad === 'function') {
                    try { video._hlsIns.startLoad(-1); } catch (e) {}
                }
            }, 260);
        }
    }

    function scheduleReleasePoolVideo(video, delayMs) {
        if (!video) {
            return;
        }
        if (video._releaseTimer) {
            clearTimeout(video._releaseTimer);
        }
        video._releaseTimer = setTimeout(function() {
            detachPoolVideo(video);
        }, delayMs);
    }

    function prefetchStreamSource(src) {
        if (!src || feedPrewarmDone[src] || feedPrewarmPending[src]) {
            return;
        }
        feedPrewarmPending[src] = true;
        feedMetrics.prewarmHits++;
        var isM3u8 = /\.m3u8(\?|$)/i.test(src);
        if (isM3u8) {
            fetch(src, { credentials: 'same-origin' }).then(function(res) {
                return res.text();
            }).then(function(text) {
                var lines = (text || '').split(/\r?\n/);
                var segUrls = [];
                for (var i = 0; i < lines.length; i++) {
                    var line = (lines[i] || '').trim();
                    if (!line || line.charAt(0) === '#') {
                        continue;
                    }
                    segUrls.push(new URL(line, src).toString());
                    if (segUrls.length >= 2) {
                        break;
                    }
                }
                if (segUrls.length === 0) {
                    return null;
                }
                return Promise.all(segUrls.map(function(segUrl) {
                    return fetch(segUrl, { credentials: 'same-origin' });
                }));
            }).then(function() {
                feedPrewarmDone[src] = true;
            }).catch(function() {
            }).finally(function() {
                delete feedPrewarmPending[src];
            });
            return;
        }
        fetch(src, {
            credentials: 'same-origin',
            headers: { 'Range': 'bytes=0-524287' }
        }).then(function() {
            feedPrewarmDone[src] = true;
        }).catch(function() {
        }).finally(function() {
            delete feedPrewarmPending[src];
        });
    }

    function releaseFarFeedPlayers(items, activeIndex, direction) {
        var keepMin = direction === 'up' ? activeIndex - 2 : activeIndex - 1;
        var keepMax = direction === 'up' ? activeIndex + 1 : activeIndex + 2;
        for (var i = 0; i < feedVideoPool.length; i++) {
            var video = feedVideoPool[i];
            if (!video || !video.parentNode) {
                continue;
            }
            var ownerIndex = Number(video.getAttribute('data-feed-index') || '-1');
            if (ownerIndex >= 0 && ownerIndex >= keepMin && ownerIndex <= keepMax) {
                continue;
            }
            if (ownerIndex === keepMin - 1 || ownerIndex === keepMax + 1) {
                scheduleReleasePoolVideo(video, 1200);
                continue;
            }
            detachPoolVideo(video);
        }
    }

    function updateFeedSourceBadge(videoEl, type) {
        if (!videoEl || !videoEl.parentNode) {
            return;
        }
        var badge = videoEl.parentNode.querySelector('.feed-source-badge');
        if (!badge) {
            return;
        }
        var icon = badge.querySelector('i');
        var text = badge.querySelector('span');
        if (text) {
            text.textContent = type === 'HLS' ? 'HLS' : 'MP4';
        }
        if (icon) {
            icon.className = type === 'HLS' ? 'mdi mdi-play-network' : 'mdi mdi-file-video';
        }
    }

    function bindFeedScroll() {
        $('#videoFeed').on('scroll', function() {
            var el = this;
            var scrollTop = el.scrollTop || 0;
            var itemHeight = el.clientHeight || 1;
            var spacerHeight = feedTrimmedHeadCount * itemHeight;
            var contentScrollTop = Math.max(0, scrollTop - spacerHeight);
            var currentAbsIndex = Math.max(0, feedTrimmedHeadCount + Math.floor(contentScrollTop / itemHeight));
            if (currentAbsIndex !== feedCurrentAbsIndex) {
                feedCurrentAbsIndex = currentAbsIndex;
                renderFeedPlaylist();
            }
            var offset = contentScrollTop % itemHeight;
            var ratio = offset / itemHeight;
            var direction = scrollTop >= feedLastScrollTop ? 'down' : 'up';
            feedScrollDirection = direction;
            feedLastScrollTop = scrollTop;

            var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
            if (items.length > 0) {
                var warmIndex = currentAbsIndex;
                if (direction === 'down' && ratio >= 0.2) {
                    warmIndex = currentAbsIndex + 1;
                } else if (direction === 'up' && ratio <= 0.8) {
                    warmIndex = Math.max(0, currentAbsIndex);
                }
                prewarmFeedIndexWindow(items, warmIndex, direction);
                pruneFeedDom(items, currentAbsIndex, itemHeight);
                trimFutureFeedDom(currentAbsIndex, direction);
                var remaining = feedAllItems.length - 1 - warmIndex;
                if (remaining <= feedPrefetchPageThreshold && hasMore && !isLoading) {
                    page++;
                    findList(page);
                }
            }

            if (!hasMore || isLoading) {
                return;
            }
            if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
                page++;
                findList(page);
            }
        });
    }

    function pruneFeedDom(items, currentAbsIndex, itemHeight) {
        if (!items || items.length <= 12) {
            return;
        }
        var removeBefore = currentAbsIndex - 4;
        if (removeBefore < 0) {
            return;
        }
        var removed = 0;
        for (var i = 0; i < items.length; i++) {
            var abs = Number(items[i].getAttribute('data-abs-index') || '-1');
            if (abs >= 0 && abs < removeBefore) {
                items[i].remove();
                removed++;
            }
        }
        if (removed > 0) {
            feedTrimmedHeadCount += removed;
            $('#feedTopSpacer').css('height', (feedTrimmedHeadCount * itemHeight) + 'px');
        }
    }

    function trimFutureFeedDom(currentAbsIndex, direction) {
        var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        if (items.length <= feedMaxDomItems) {
            return;
        }
        for (var i = 0; i < items.length; i++) {
            var abs = Number(items[i].getAttribute('data-abs-index') || '-1');
            if (direction === 'up') {
                if (abs > currentAbsIndex + 6) {
                    items[i].remove();
                }
                continue;
            }
            if (abs > currentAbsIndex + 8) {
                items[i].remove();
            }
        }
        items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        if (items.length <= feedMaxDomItems) {
            return;
        }
        for (var j = items.length - 1; j >= 0 && items.length > feedMaxDomItems; j--) {
            var tailAbs = Number(items[j].getAttribute('data-abs-index') || '-1');
            if (tailAbs > currentAbsIndex + 4) {
                items[j].remove();
                items.splice(j, 1);
            }
        }
    }

    function bindFeedKeyboard() {
        $(document).on('keydown', function(e) {
            if (mediaHomeMode !== 'feed') {
                return;
            }
            var container = $('#videoFeed')[0];
            if (!container) {
                return;
            }
            var step = container.clientHeight;
            if (e.key === 'ArrowDown') {
                container.scrollBy({ top: step, behavior: 'smooth' });
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                container.scrollBy({ top: -step, behavior: 'smooth' });
                e.preventDefault();
            }
        });
    }

    function bindFeedWheelNavigation() {
        document.addEventListener('wheel', function(e) {
            if (mediaHomeMode !== 'feed') {
                return;
            }
            var container = document.getElementById('videoFeed');
            if (!container) {
                return;
            }
            var active = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            if (!active) {
                return;
            }
            if (active !== container && !container.contains(active)) {
                return;
            }
            if (Math.abs(e.deltaY) < 8) {
                return;
            }
            var step = container.clientHeight || window.innerHeight || 1;
            container.scrollBy({ top: e.deltaY > 0 ? step : -step, behavior: 'smooth' });
            e.preventDefault();
        }, { passive: false });
    }

    function bindFeedControls() {
        $('#feedOrderBtn').on('click', function() {
            if (feedOrder === 'desc') {
                feedOrder = 'asc';
            } else if (feedOrder === 'asc') {
                feedOrder = 'random';
            } else {
                feedOrder = 'desc';
            }
            updateFeedButtons();
            applyOrderWithoutReload();
        });

        $('#feedAuthorBtn').on('click', function() {
            openFeedAuthorSelector();
        });

        $('#feedMuteBtn').on('click', function() {
            feedMuted = !feedMuted;
            $('#videoFeed .feed-video').each(function() {
                this.muted = feedMuted;
            });
            updateFeedButtons();
        });

        $('#feedPlaylistBtn').on('click', function() {
            $('#feedPlaylistDrawer').toggleClass('open');
            renderFeedPlaylist();
        });

        $('#feedPlaylistList').on('click', '.feed-playlist-item', function() {
            var abs = Number(this.getAttribute('data-abs') || '-1');
            if (abs < 0) {
                return;
            }
            jumpToFeedAbsIndex(abs);
        });

        $('#videoFeed').on('click', '.feed-author-chip', function(e) {
            e.stopPropagation();
            var author = ($(this).data('author') || '').toString().trim();
            if (!author || author === '未知作者' || author === '****') {
                return;
            }
            feedAuthor = author;
            updateFeedButtons();
            reloadFeed();
        });

        $('#videoFeed').on('click', '.feed-debug-btn', function(e) {
            e.stopPropagation();
            var item = this.parentNode;
            if (!item) {
                return;
            }
            var panel = item.querySelector('.feed-debug-panel');
            var video = item.querySelector('.feed-video');
            if (!panel || !video) {
                return;
            }
            var visible = panel.classList.contains('visible');
            document.querySelectorAll('#videoFeed .feed-debug-panel.visible').forEach(function(p){
                p.classList.remove('visible');
                if (p._timer) {
                    clearInterval(p._timer);
                    p._timer = null;
                }
            });
            if (visible) {
                return;
            }
            panel.textContent = buildFeedDebugText(video);
            panel.classList.add('visible');
            panel._timer = setInterval(function() {
                panel.textContent = buildFeedDebugText(video);
            }, 500);
        });

        $('#videoFeed').on('click', '.feed-item', function(e) {
            if (!e.target.classList.contains('feed-debug-btn') && !e.target.closest('.feed-debug-btn')) {
                var panel = this.querySelector('.feed-debug-panel');
                if (panel) {
                    panel.classList.remove('visible');
                    if (panel._timer) {
                        clearInterval(panel._timer);
                        panel._timer = null;
                    }
                }
            }
        });
    }

    function buildFeedDebugText(video) {
        var boundSrc = video.getAttribute('data-bound-src') || video.currentSrc || '';
        var type = video.getAttribute('data-source-type') || (/\.m3u8(\?|$)/i.test(boundSrc) ? 'HLS' : 'MP4');
        var lines = [];
        lines.push('Type: ' + type);
        lines.push('ReadyState: ' + video.readyState);
        lines.push('Resolution: ' + (video.videoWidth || 0) + 'x' + (video.videoHeight || 0));
        lines.push('Time: ' + (video.currentTime || 0).toFixed(2));
        lines.push('Buffered: ' + getBufferedEnd(video));
        lines.push('PlaybackRate: ' + (video.playbackRate || 1).toFixed(2));
        lines.push('DroppedFrames: ' + getDroppedFrames(video));
        lines.push('PoolRole: ' + (video._poolRole || '-'));
        lines.push('PlayAttempts: ' + feedMetrics.playAttempts);
        lines.push('FirstFrameHits: ' + feedMetrics.firstFrameHits);
        lines.push('PrewarmHits: ' + feedMetrics.prewarmHits);
        lines.push('StallsRecovered: ' + feedMetrics.stallsRecovered);
        lines.push('FallbackToMp4: ' + feedMetrics.fallbackToMp4);
        return lines.join('\n');
    }

    function getBufferedEnd(video) {
        try {
            if (!video.buffered || video.buffered.length === 0) {
                return '0.00';
            }
            var end = video.buffered.end(video.buffered.length - 1);
            return end.toFixed(2);
        } catch (e) {
            return '0.00';
        }
    }

    function getDroppedFrames(video) {
        try {
            if (!video) {
                return '0';
            }
            if (video.getVideoPlaybackQuality) {
                var q = video.getVideoPlaybackQuality();
                if (q && typeof q.droppedVideoFrames === 'number') {
                    return String(q.droppedVideoFrames);
                }
            }
            if (typeof video.webkitDroppedFrameCount === 'number') {
                return String(video.webkitDroppedFrameCount);
            }
        } catch (e) {}
        return '0';
    }

    function reloadFeed() {
        page = 0;
        hasMore = true;
        isLoading = false;
        $('#videoFeed').empty();
        feedAbsCounter = 0;
        feedTrimmedHeadCount = 0;
        ensureFeedSpacer();
        feedAuthorSet = {};
        feedAllItems = [];
        feedAllLoaded = false;
        feedFullScanInProgress = false;
        feedRandomPool = [];
        feedRandomCursor = 0;
        feedRandomLoading = false;
        feedCurrentAbsIndex = -1;
        if (feedOrder === 'random') {
            feedSessionSeed = String(Date.now()) + '_' + String(Math.floor(Math.random() * 1000000));
        }
        renderFeedPlaylist();
        findList(page);
    }

    function applyOrderWithoutReload() {
        if (mediaHomeMode !== 'feed') {
            return;
        }
        reloadFeed();
    }

    function loadAllFeedItemsAndApplyOrder() {
        if (feedFullScanInProgress) {
            return;
        }
        feedFullScanInProgress = true;
        var reqPage = 0;
        var merged = [];
        var pageSize = 50;
        var retryCount = 0;
        var maxRetry = 2;
        var maxPages = 500;
        var loadingLayer = layer.load(2, { shade: [0.15, '#000'] });

        function nextPage() {
            if (reqPage > maxPages) {
                finish(false);
                return;
            }
            var option = buildFeedRequestOption(reqPage, pageSize);
            $.post('/admin/api/findVideoDataList', option, function(data) {
                if (!data || data.resCode !== '000001' || !data.record || !data.record.content) {
                    if (retryCount < maxRetry) {
                        retryCount++;
                        setTimeout(nextPage, 160);
                        return;
                    }
                    finish(false);
                    return;
                }
                retryCount = 0;
                var list = data.record.content || [];
                if (list.length > 0) {
                    merged = merged.concat(list);
                    appendFeedAuthorOptions(list);
                }
                if (data.record.last || list.length === 0) {
                    feedAllItems = merged;
                    feedAllLoaded = true;
                    page = reqPage;
                    hasMore = false;
                    finish(true);
                    return;
                }
                reqPage++;
                nextPage();
            }).fail(function() {
                if (retryCount < maxRetry) {
                    retryCount++;
                    setTimeout(nextPage, 160);
                    return;
                }
                finish(false);
            });
        }

        function finish(success) {
            feedFullScanInProgress = false;
            layer.close(loadingLayer);
            if (!success) {
                if (merged.length > 0) {
                    feedAllItems = merged;
                }
                renderFeedByOrderLocal();
                layer.msg('完整列表加载中断，已基于当前可用数据切换顺序', {icon: 0, time: 1500});
                return;
            }
            applyOrderWithoutReload();
        }

        nextPage();
    }

    function shuffleList(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = arr[i];
            arr[i] = arr[j];
            arr[j] = temp;
        }
        return arr;
    }

    function buildFeedRequestOption(pageNo, pageSize) {
        var option = {
            pageNo: pageNo,
            pageSize: pageSize || 8
        };
        if (mediaHomeMode === 'feed') {
            if (feedOrder === 'asc' || feedOrder === 'desc') {
                option.sortField = 'createtime';
                option.sortOrder = feedOrder;
            } else if (feedOrder === 'random') {
                option.randomMode = '1';
                option.randomSeed = feedSessionSeed;
            }
            if (feedAuthor && feedAuthor.trim() !== '') {
                option.videoauthor = feedAuthor.trim();
            }
        }
        return option;
    }

    function jumpToFeedAbsIndex(absIndex) {
        var container = $('#videoFeed')[0];
        if (!container) {
            return;
        }
        var itemHeight = container.clientHeight || 1;
        var targetTop = absIndex * itemHeight;
        container.scrollTo({ top: targetTop, behavior: 'smooth' });
        feedCurrentAbsIndex = absIndex;
        var items = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        prewarmFeedIndexWindow(items, absIndex, 'down');
        renderFeedPlaylist();
    }

    function renderFeedPlaylist() {
        if (mediaHomeMode !== 'feed') {
            return;
        }
        var wrap = $('#feedPlaylistList');
        if (!wrap.length) {
            return;
        }
        var html = '';
        for (var i = 0; i < feedAllItems.length; i++) {
            var item = feedAllItems[i] || {};
            var title = item.videoprivacy === '1' ? '******' : (item.videoname || '未命名视频');
            var author = item.videoprivacy === '1' ? '****' : (item.videoauthor || '未知作者');
            var activeCls = i === feedCurrentAbsIndex ? ' active' : '';
            html += '<button type="button" class="feed-playlist-item' + activeCls + '" data-abs="' + i + '">';
            html += '<span>' + escapeHtml((i + 1) + '. ' + title) + '</span>';
            html += '<span class="meta">@' + escapeHtml(author) + '</span>';
            html += '</button>';
        }
        if (!html) {
            html = '<div style="padding:12px;color:#cbd5e1;font-size:12px;">暂无播放项</div>';
        }
        wrap.html(html);
    }

    function renderFeedByOrderLocal() {
        if (!feedAllItems || feedAllItems.length === 0) {
            return;
        }
        var itemEls = Array.prototype.slice.call(document.querySelectorAll('#videoFeed .feed-item'));
        var activeAbs = -1;
        if (itemEls.length > 0) {
            var viewTop = ($('#videoFeed')[0] || {}).scrollTop || 0;
            var itemHeight = ($('#videoFeed')[0] || {}).clientHeight || 1;
            var spacerHeight = feedTrimmedHeadCount * itemHeight;
            activeAbs = Math.max(0, feedTrimmedHeadCount + Math.round(Math.max(0, viewTop - spacerHeight) / itemHeight));
        }
        var sorted = feedAllItems.slice();
        if (feedOrder === 'asc') {
            sorted.sort(function(a, b) { return new Date(a.createtime).getTime() - new Date(b.createtime).getTime(); });
        } else if (feedOrder === 'desc') {
            sorted.sort(function(a, b) { return new Date(b.createtime).getTime() - new Date(a.createtime).getTime(); });
        } else {
            shuffleList(sorted);
        }
        var html = '';
        for (var i = 0; i < sorted.length; i++) {
            html += buildFeedItemHtml(sorted[i], sorted[i].videoprivacy === '1');
        }
        $('#videoFeed').empty();
        ensureFeedSpacer();
        $('#videoFeed').append(html);
        feedAbsCounter = 0;
        feedTrimmedHeadCount = 0;
        hydrateFeedItems();
        initFeedAutoPlay();
        var c = $('#videoFeed')[0];
        if (c && activeAbs > 0) {
            c.scrollTop = activeAbs * (c.clientHeight || 1);
        }
    }

    function loadRandomPoolAndRender() { return; }

    function renderNextRandomBatch(forceFirst) {
        if (feedOrder !== 'random') {
            return;
        }
        if (forceFirst) {
            $('#videoFeed').empty();
        }
        if (!feedRandomPool || feedRandomPool.length === 0) {
            hasMore = false;
            return;
        }
        var start = feedRandomCursor;
        var end = Math.min(feedRandomCursor + feedRandomBatchSize, feedRandomPool.length);
        if (start >= end) {
            hasMore = false;
            return;
        }
        var html = '';
        for (var i = start; i < end; i++) {
            var item = feedRandomPool[i];
            var isPrivate = item.videoprivacy === '1';
            html += buildFeedItemHtml(item, isPrivate);
        }
        feedRandomCursor = end;
        hasMore = feedRandomCursor < feedRandomPool.length;
        requestAnimationFrame(function() {
            $('#videoFeed').append(html);
            hydrateFeedItems();
            initFeedAutoPlay();
        });
    }

    function appendFeedAuthorOptions(list) {
        for (var i = 0; i < list.length; i++) {
            var author = (list[i].videoauthor || '').trim();
            if (!author || feedAuthorSet[author]) {
                continue;
            }
            feedAuthorSet[author] = true;
        }
    }

    function openFeedAuthorSelector() {
        var authors = Object.keys(feedAuthorSet).sort();
        var html = '<div class="author-sheet">';
        html += '<div class="author-sheet-header">选择作者</div>';
        html += '<button type="button" class="btn btn-sm btn-outline-primary feed-author-option author-chip" data-author="">全部作者</button>';
        for (var i = 0; i < authors.length; i++) {
            html += '<button type="button" class="btn btn-sm btn-outline-secondary feed-author-option author-chip" data-author="' + escapeHtml(authors[i]) + '">' + escapeHtml(authors[i]) + '</button>';
        }
        html += '</div>';
        authorSheetIndex = layer.open({
            type: 1,
            title: false,
            closeBtn: 1,
            shadeClose: true,
            area: ['100%', '68vh'],
            offset: 'b',
            skin: 'layui-layer-rim',
            content: html
        });
        $(document).off('click.feedAuthorOption').on('click.feedAuthorOption', '.feed-author-option', function() {
            feedAuthor = ($(this).data('author') || '').toString().trim();
            updateFeedButtons();
            reloadFeed();
            layer.close(authorSheetIndex);
            $(document).off('click.feedAuthorOption');
        });
    }

    function updateFeedButtons() {
        var orderText = feedOrder === 'asc' ? '顺序' : (feedOrder === 'random' ? '随机' : '倒序');
        $('#feedOrderBtn span').text(orderText);
        var authorText = feedAuthor && feedAuthor.trim() !== '' ? feedAuthor : '全部';
        if (authorText.length > 4) {
            authorText = authorText.substring(0, 4) + '…';
        }
        $('#feedAuthorBtn span').text(authorText);
        $('#feedMuteBtn i').attr('class', feedMuted ? 'mdi mdi-volume-off' : 'mdi mdi-volume-high');
        $('#feedMuteBtn span').text(feedMuted ? '静音' : '有声');
    }

    function escapeHtml(text) {
        return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
</script>
</body>
