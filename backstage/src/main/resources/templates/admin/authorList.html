<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>作者列表</title>
	<th:block th:insert="~{admin/include/header :: metaHeader}"></th:block>
	<link href="../static/css/bootstrap.min.css" rel="stylesheet">
	<link href="../static/css/materialdesignicons.min.css" rel="stylesheet">
	<link href="../static/css/style.min.css" rel="stylesheet">
	<link href="../static/js/skin/laypage.css" rel="stylesheet">
	<style>
		.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
		.toolbar .form-control { min-width:180px; }
		.avatar { width:40px; height:40px; border-radius:20px; object-fit:cover; background:#f3f4f6; }
		.mono { font-family: Consolas, monospace; font-size: 12px; }
		.text-ellipsis { max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		.repair-status { margin:0 0 16px; display:none; }
		.repair-status strong { margin-right:12px; }
	</style>
</head>
<body>
<div class="lyear-layout-web"><div class="lyear-layout-container"><div th:insert="~{admin/include/common :: headermenu}"></div>
<main class="lyear-layout-content"><div class="container-fluid"><div class="row"><div class="col-lg-12"><div class="card"><div class="card-header bg-light"><div class="toolbar"><input id="keyword" class="form-control" placeholder="搜索名称/用户名/UID"><input id="platform" class="form-control" placeholder="平台"><button id="searchBtn" class="btn btn-primary btn-sm"><i class="mdi mdi-magnify"></i> 搜索</button><button id="resetBtn" class="btn btn-default btn-sm"><i class="mdi mdi-refresh"></i> 重置</button><button id="repairDouyinMetadataBtn" class="btn btn-info btn-sm"><i class="mdi mdi-auto-fix"></i> 修复抖音元数据</button><button id="previewDouyinAuthorsBtn" class="btn btn-default btn-sm"><i class="mdi mdi-database-search"></i> 检查作者数据</button><button id="rebuildDouyinBtn" class="btn btn-warning btn-sm" disabled><i class="mdi mdi-account-convert"></i> 执行作者修复</button><button id="cleanupHistoryBtn" class="btn btn-danger btn-sm"><i class="mdi mdi-delete-sweep"></i> 清理重复处理历史</button></div></div><div class="card-body"><div id="authorRepairStatus" class="alert alert-info repair-status"></div><div class="table-responsive"><table class="table table-bordered"><thead><tr><th>ID</th><th>平台</th><th>头像</th><th>当前显示名</th><th>用户名</th><th>UID</th><th>主页</th><th>更新时间</th><th>历史名</th><th>操作</th></tr></thead><tbody id="tableData"></tbody></table></div><ul id="pager" class="pagination"></ul></div></div></div></div></div></main></div></div>
<script type="text/javascript" src="../static/js/jquery.min.js"></script>
<script type="text/javascript" src="../static/js/bootstrap.min.js"></script>
<script type="text/javascript" src="../static/js/laypage.js"></script>
<script src="../static/js/layer/layer.js"></script>
	<script>
		var currentPage = 1;
		var authorRepairPollTimer = null;
		var authorRepairPreview = null;
		function findList(page){
			var option = { pageNo: page, pageSize: 15, keyword: $('#keyword').val(), platform: $('#platform').val() };
			$('#tableData').html('<tr><td colspan="10" class="text-center text-muted">加载中...</td></tr>');
			$.post('/admin/api/findAuthorProfileList', option, function(res){
				if(res.resCode !== '000001'){ layer.msg(res.message || '加载失败'); return; }
				var record = res.record || {}; var list = record.content || []; var html='';
				for(var i=0;i<list.length;i++){
					var item = list[i];
					var platformValue = (item.platformkey || item.platform || '').toString().toLowerCase();
					var authorUid = (item.authoruid || '').toString().trim();
					var canRefresh = (platformValue === 'douyin' || platformValue.indexOf('抖音') >= 0)
						&& authorUid.indexOf('MS4') === 0;
					html += '<tr>';
					html += '<td>'+ (item.id||'') +'</td>';
					html += '<td>'+ (item.platform||'') +'</td>';
					html += '<td>'+ (item.avatar ? '<img src="'+item.avatar+'" class="avatar">' : '--') +'</td>';
					html += '<td class="text-ellipsis" title="'+ (item.displayname||'--') +'">'+ (item.displayname||'--') +'</td>';
					html += '<td class="mono">'+ (item.username||'--') +'</td>';
					html += '<td class="mono">'+ (item.authoruid||'--') +'</td>';
					html += '<td>'+ (item.homepage ? '<a href="'+item.homepage+'" target="_blank">主页</a>' : '--') +'</td>';
					html += '<td>'+ (item.updatetime || '') +'</td>';
					html += '<td><button class="btn btn-outline-info btn-sm historyBtn" data-id="'+item.id+'">查看</button></td>';
					html += '<td><button class="btn btn-outline-primary btn-sm refreshProfileBtn" data-id="'+item.id+'"'
						+ (canRefresh ? '' : ' disabled title="作者 UID 待修复"') +'><i class="mdi mdi-sync"></i> 刷新</button></td>';
					html += '</tr>';
				}
				$('#tableData').html(html || '<tr><td colspan="10" class="text-center text-muted">暂无作者档案数据</td></tr>');
			$('.historyBtn').click(function(){
				var id = $(this).data('id');
				$.get('/admin/api/findAuthorNameHistory', { authorProfileId:id }, function(r){
				if(r.resCode !== '000001'){ layer.msg(r.message || '加载失败'); return; }
					var arr = r.record || []; var text = '<div style="padding:12px;line-height:1.8;">';
					text += '<div style="margin-bottom:8px;color:#666;">共 ' + arr.length + ' 条历史名称</div>';
					for(var j=0;j<arr.length;j++){
						text += '<div><strong>'+ (arr[j].displayname || '--') +'</strong><div style="font-size:12px;color:#999;">首次：'+ (arr[j].firstseentime || '--') +' / 最近：'+ (arr[j].lastseentime || '--') +'</div></div>';
					}
					if(arr.length === 0){ text += '<div class="text-muted">暂无历史名称</div>'; }
					text += '</div>'; layer.open({type:1,title:'历史名称',area:['420px','320px'],content:text});
				});
			});
			$('.refreshProfileBtn').click(function(){
				var button = $(this);
				if (button.prop('disabled')) return;
				var originalHtml = button.html();
				button.prop('disabled', true).html('<i class="mdi mdi-loading mdi-spin"></i> 刷新中');
				$.post('/admin/api/refreshDouyinAuthorProfile', { authorProfileId: button.data('id') }, function(r){
					if(r.resCode !== '000001'){
						button.prop('disabled', false).html(originalHtml);
						layer.msg(r.message || '作者资料刷新失败');
						return;
					}
					var result = r.record || {};
					layer.alert('作者资料刷新完成<br>作者字段：'+(result.authorFieldsUpdated||0)
						+'<br>视频作品：'+(result.videosUpdated||0)+'<br>图文作品：'+(result.graphicsUpdated||0),
						{title:'刷新完成'});
					findList(currentPage);
				}).fail(function(xhr){
					button.prop('disabled', false).html(originalHtml);
					var message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : '作者资料刷新请求失败';
					layer.msg(message);
				});
			});
			var pages = record.totalPages || (record.page && record.page.totalPages) || 1;
			laypage({ cont:'pager', pages: pages, curr: page, jump:function(obj,first){ if(!first){ currentPage=obj.curr; findList(obj.curr); } } });
		});
	}
	$('#searchBtn').click(function(){ currentPage = 1; findList(1); });
	$('#resetBtn').click(function(){ $('#keyword').val(''); $('#platform').val(''); currentPage = 1; findList(1); });
	$('#repairDouyinMetadataBtn').click(function(){
		layer.confirm('将补充抖音 jsonData 和原作品链接，不会重新下载媒体文件，也不会修改下载时间。继续？', {title:'确认修复'}, function(index){
			layer.close(index);
			var loading = layer.load(1, {shade:[0.2, '#000']});
			$.post('/admin/api/repairDouyinMetadata', {}, function(res){
				layer.close(loading);
				if(res.resCode !== '000001'){ layer.msg(res.message || '修复失败'); return; }
				var r = res.record || {};
				layer.alert('修复完成<br>视频更新：'+(r.videoUpdated||0)+'<br>图文更新：'+(r.graphicUpdated||0)+'<br>jsonData更新：'+(r.jsonUpdated||0)+'<br>原链接更新：'+(r.sourceUrlUpdated||0)+'<br>失败：'+(r.failed||0));
			}).fail(function(){ layer.close(loading); layer.msg('请求失败'); });
		});
	});
	function renderAuthorRepairStatus(r){
		r = r || {};
		var total = (r.totalVideos || 0) + (r.totalGraphics || 0);
		var scanned = (r.scannedVideos || 0) + (r.scannedGraphics || 0);
		var percent = total > 0 ? Math.min(100, Math.round(scanned * 100 / total)) : 0;
		var html = '<strong>状态：'+ (r.phase || r.state || '等待') +'</strong>';
		html += '进度：'+ scanned +'/'+ total +' ('+ percent +'%)';
		html += '，已更新：'+ ((r.updatedVideos || 0) + (r.updatedGraphics || 0));
		html += '，本地解析：'+ (r.localResolved || 0);
		html += '，资料 API 补全：'+ (r.apiResolved || 0);
		html += '，合并档案：'+ (r.mergedProfiles || 0);
		html += '，未解析：'+ (r.unresolved || 0);
		html += '，单条失败：'+ (r.failedRows || 0);
		if(r.message){ html += '<br>'+ r.message; }
		$('#authorRepairStatus').html(html).show();
		var running = r.state === 'running';
		$('#rebuildDouyinBtn').prop('disabled', running || !authorRepairPreview);
		$('#previewDouyinAuthorsBtn').prop('disabled', running);
		if(!running && authorRepairPollTimer){
			clearInterval(authorRepairPollTimer); authorRepairPollTimer = null;
			if(r.state === 'completed'){ findList(currentPage); }
		}
	}
	function loadAuthorRepairStatus(){
		$.get('/admin/api/douyinAuthorReconcileStatus', function(res){
			if(res.resCode === '000001'){
				renderAuthorRepairStatus(res.record);
				if(res.record && res.record.state === 'running' && !authorRepairPollTimer){
					authorRepairPollTimer = setInterval(loadAuthorRepairStatus, 1500);
				}
			}
		});
	}
	function startAuthorRepairPolling(){
		if(authorRepairPollTimer){ clearInterval(authorRepairPollTimer); }
		authorRepairPollTimer = setInterval(loadAuthorRepairStatus, 1500);
		loadAuthorRepairStatus();
	}
	$('#previewDouyinAuthorsBtn').click(function(){
		var loading = layer.load(1, {shade:[0.1, '#000']});
		$.get('/admin/api/douyinAuthorReconcilePreview', function(res){
			layer.close(loading);
			if(res.resCode !== '000001'){ layer.msg(res.message || '检查失败'); return; }
			authorRepairPreview = res.record || {};
			var r = authorRepairPreview;
			var integrity = r.safeToRun ? '正常' : (r.databaseIntegrity || '未通过');
			$('#authorRepairStatus').html('<strong>只读检查完成</strong>数据库：'+integrity+'；视频：'+(r.videos||0)+'，候选修复：'+(r.videoCandidates||0)+'；图文：'+(r.graphics||0)+'，候选修复：'+(r.graphicCandidates||0)+'；作者档案：'+(r.profiles||0)+'，旧 UID 档案：'+(r.legacyProfiles||0)).show();
			$('#rebuildDouyinBtn').prop('disabled', !r.safeToRun);
			if(!r.safeToRun){ layer.alert('数据库完整性检查未通过，已禁止执行修复。请先检查生产数据库及其 WAL/SHM 文件是否完整。'); }
		}).fail(function(){ layer.close(loading); layer.msg('检查请求失败'); });
	});
	$('#rebuildDouyinBtn').click(function(){
		var r = authorRepairPreview || {};
		layer.confirm('将分页扫描 '+((r.videos||0)+(r.graphics||0))+' 条抖音作品，优先使用本地 JSON，必要时按 UID 调用作者资料 API。任务在后台执行，无法解析的数据保持不变。是否继续？', {title:'确认执行作者修复'}, function(index){
			layer.close(index);
			$.post('/admin/api/startDouyinAuthorReconcile', {}, function(res){
				if(res.resCode !== '000001'){ layer.msg(res.message || '修复失败'); return; }
				renderAuthorRepairStatus(res.record);
				startAuthorRepairPolling();
			}).fail(function(){ layer.msg('请求失败'); });
		});
	});
	$('#cleanupHistoryBtn').click(function(){
		layer.confirm('将按抖音原链接清理重复处理历史，每个链接只保留最新一条，是否继续？', {title:'确认清理'}, function(index){
			layer.close(index);
			$.post('/admin/api/cleanupDuplicateDouyinHistory', {}, function(res){
				if(res.resCode !== '000001'){ layer.msg(res.message || '清理失败'); return; }
				var r = res.record || {};
				layer.alert('清理完成<br>扫描：'+(r.scanned||0)+'<br>删除重复：'+(r.deleted||0));
			}).fail(function(){ layer.msg('请求失败'); });
		});
	});
	$('#keyword, #platform').on('keydown', function(e){ if(e.key === 'Enter'){ currentPage = 1; findList(1); } });
	$(function(){ findList(1); loadAuthorRepairStatus(); });
	</script>
</body></html>
