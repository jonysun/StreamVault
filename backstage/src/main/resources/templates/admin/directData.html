<script type="text/javascript">
$(document).ready(function() {
    $('input[name="operationMode"]').on('change', updateSubmitButton);

    let currentMultipleRecord = null;
    let selectedMultipleIndexes = new Set();

    function selectedMode() {
        return $('input[name="operationMode"]:checked').val() || 'preview';
    }

    function updateSubmitButton() {
        const preview = selectedMode() === 'preview';
        $('#submitBtn').html(preview
            ? '<i class="mdi mdi-magnify"></i> 执行预览'
            : '<i class="mdi mdi-download"></i> 下载入库');
    }

    /**
     * 表单提交处理函数
     * 处理视频链接解析的表单提交
     */
    $('#directDataForm').on('submit', function(e) {
        e.preventDefault();
        
        const videoUrl = $('#videoUrl').val().trim();
        const mode = selectedMode();
        
        // 验证输入
        if (!videoUrl) {
            layer.msg('请输入视频分享链接', {icon: 2});
            return;
        }
        
        // 显示加载状态
        showLoading(mode);
        
        // 构建API URL
        // Only collections need a preview before ingest. Ordinary single-work
        // submissions keep the original one-request path.
        const previewBeforeIngest = mode === 'ingest' && isYoutubeCollectionUrl(videoUrl);
        let apiUrl = '/admin/api/directData?type=' + (mode === 'preview' || previewBeforeIngest ? '2' : '1');
        
        // 发送请求
        $.ajax({
            url: apiUrl,
            type: 'POST',
            data: {
                originaladdress: videoUrl
            },
            success: function(response) {
                console.log('API响应成功:', response);
                hideLoading();
                handleApiResponse(response, mode, videoUrl);
            },
            error: function(xhr, status, error) {
                console.error('API请求失败:', error);
                hideLoading();
                layer.msg('请求失败，请稍后重试', {icon: 2});
            }
        });
    });
    
    /**
     * 显示加载状态
     */
    function showLoading(mode) {
        $('#loadingDiv').show();
        $('#resultDiv').hide();
        $('#loadingDiv p').text(mode === 'preview' ? '正在解析...' : '正在提交...');
        $('#submitBtn').prop('disabled', true).html('<i class="mdi mdi-loading mdi-spin"></i> 处理中...');
    }
    
    /**
     * 隐藏加载状态
     */
    function hideLoading() {
        $('#loadingDiv').hide();
        $('#submitBtn').prop('disabled', false);
        updateSubmitButton();
    }
    
    /**
     * 处理API响应
     * @param {Object} response - API响应数据
     * @param {string} mode - preview 或 ingest
     */
    function handleApiResponse(response, mode, originalUrl) {
        if (response.resCode === '000001') {
            if (mode === 'preview' && response.record) {
                const record = response.record;
                if (record.type === 'multiple') {
                    renderMultipleVideos(record);
                } else {
                    renderVideoInfo(record);
                }
            } else if (mode === 'ingest' && response.record) {
                const record = response.record;
                if (record.type === 'multiple') {
                    renderMultipleVideos(record);
                } else {
                    submitSingleWork(originalUrl);
                }
            } else {
                renderSubmission(response);
            }
        } else if (response.resCode === '999998' || response.resCode === '999997') {
            layer.msg(response.message || '解析失败', {icon: 2});
            $('#resultDiv').hide();
        } else {
            layer.msg(response.message || '解析失败', {icon: 2});
            $('#resultDiv').hide();
        }
    }

    function submitSingleWork(url) {
        $.ajax({
            url: '/admin/api/directData?type=1',
            type: 'POST',
            data: { originaladdress: url },
            success: function(response) {
                if (response.resCode === '000001') renderSubmission(response);
                else layer.msg(response.message || '下载提交失败', {icon: 2});
            },
            error: function() { layer.msg('下载提交失败', {icon: 2}); }
        });
    }

    function isYoutubeCollectionUrl(url) {
        if (!url) return false;
        const normalized = String(url).toLowerCase();
        const isYoutube = normalized.includes('youtube.com') || normalized.includes('youtu.be');
        return isYoutube && (normalized.includes('/playlist?') || /[?&]list=[^&\s]+/.test(normalized));
    }

    function renderSubmission(response) {

    /**
     * 渲染多个视频
     * @param {Object} record - 多视频记录数据
     */
    function renderMultipleVideos(record) {
        const platform = record.platform || '未知平台';
        const totalCount = record.totalCount || 0;
        const videos = record.videos || [];
        currentMultipleRecord = record;
        selectedMultipleIndexes = new Set();
        
        let videosHtml = videos.map((video, index) => {
            const title = video.title || '无标题';
            const author = video.author || '未知作者';
            const duration = video.duration ? formatDuration(video.duration) : '未知';
            const videoUrl = video.videoUrl || '';
            const audioUrl = video.audioUrl || '';
            const coverUrl = video.coverUrl || '';
            const isDash = video.isDash || false;
            const sourceUrl = video.sourceUrl || '';
            
            return `
                <div class="video-item mb-3">
                    <div class="video-item-content">
                        <label class="mr-2" title="选择下载">
                            <input type="checkbox" class="multiple-video-checkbox" data-index="${index}" ${sourceUrl ? '' : 'disabled'}>
                        </label>
                        ${coverUrl ? `<img src="${escapeHtml(coverUrl)}" class="video-cover" alt="视频${index + 1}封面" referrerpolicy="no-referrer">` : ''}
                        <div class="video-info">
                            <h6 class="video-title"><strong>${index + 1}. ${escapeHtml(title)}</strong></h6>
                            <div class="video-meta">
                                <span class="meta-item"><i class="mdi mdi-account"></i> ${escapeHtml(author)}</span>
                                <span class="meta-item"><i class="mdi mdi-clock"></i> ${duration}</span>
                                ${isDash ? '<span class="meta-item badge-dash">DASH</span>' : ''}
                            </div>
                            <div class="video-actions">
                                ${videoUrl ? `<button class="btn btn-sm btn-secondary" data-copy-url="${escapeHtml(videoUrl)}">
                                    <i class="mdi mdi-content-copy"></i> 复制
                                </button>` : ''}
                                ${audioUrl ? `<button class="btn btn-sm btn-info" data-copy-url="${escapeHtml(audioUrl)}">
                                    <i class="mdi mdi-music"></i> 音频
                                </button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        const resultHtml = `
            <div class="alert alert-info">
                <i class="mdi mdi-information"></i> 检测到 <strong>${totalCount}</strong> 个视频，请选择需要下载的视频
            </div>
            <div class="platform-info mb-3">
                <strong>平台：</strong>${escapeHtml(platform)}
            </div>
            <div class="batch-selection-actions mb-3">
                <button type="button" class="btn btn-sm btn-outline-secondary" id="selectAllMultipleBtn">全选</button>
                <span class="ml-2">已选择 <strong id="selectedMultipleCount">0</strong> / ${videos.length}</span>
                <button type="button" class="btn btn-sm btn-primary ml-3" id="submitSelectedMultipleBtn" disabled>
                    <i class="mdi mdi-download"></i> 下载选中作品
                </button>
            </div>
            <div class="videos-list">
                ${videosHtml}
            </div>
        `;
        
        $('#resultContent').html(resultHtml);
        $('#resultDiv').show();

        $('#selectAllMultipleBtn').on('click', function() {
            const checkboxes = $('.multiple-video-checkbox:not(:disabled)');
            const shouldSelect = selectedMultipleIndexes.size !== checkboxes.length;
            checkboxes.prop('checked', shouldSelect).each(function() {
                const index = Number($(this).data('index'));
                if (shouldSelect) selectedMultipleIndexes.add(index);
                else selectedMultipleIndexes.delete(index);
            });
            updateMultipleSelectionUi();
        });
        $('#resultContent').off('change.multipleVideo').on(
            'change.multipleVideo', '.multiple-video-checkbox', function() {
                const index = Number($(this).data('index'));
                if (this.checked) selectedMultipleIndexes.add(index);
                else selectedMultipleIndexes.delete(index);
                updateMultipleSelectionUi();
            }
        );
        $('#submitSelectedMultipleBtn').on('click', submitSelectedMultiple);
        
        layer.msg('成功解析 ' + totalCount + ' 个视频', {icon: 1});
    }

    function updateMultipleSelectionUi() {
        const count = selectedMultipleIndexes.size;
        const available = $('.multiple-video-checkbox:not(:disabled)').length;
        $('#selectedMultipleCount').text(count);
        $('#submitSelectedMultipleBtn').prop('disabled', count === 0);
        $('#selectAllMultipleBtn').text(count === available && available > 0 ? '取消全选' : '全选');
    }

    function submitSelectedMultiple() {
        if (!currentMultipleRecord || selectedMultipleIndexes.size === 0) return;
        const selected = Array.from(selectedMultipleIndexes).sort((left, right) => left - right)
            .map(index => currentMultipleRecord.videos[index])
            .filter(video => video && video.sourceUrl);
        if (selected.length === 0) {
            layer.msg('选中作品没有可用的原始链接', {icon: 2});
            return;
        }

        const button = $('#submitSelectedMultipleBtn');
        button.prop('disabled', true).html('<i class="mdi mdi-loading mdi-spin"></i> 提交中...');
        let completed = 0;
        let failed = 0;
        let cursor = 0;
		const batchId = 'youtube-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        const submitNext = function() {
            if (cursor >= selected.length) {
                button.prop('disabled', false).html('<i class="mdi mdi-download"></i> 下载选中作品');
                layer.msg('已提交 ' + completed + ' 个，失败 ' + failed + ' 个', {icon: failed ? 2 : 1});
                return;
            }
            const video = selected[cursor++];
            $.ajax({
                url: '/admin/api/directData?type=1',
                type: 'POST',
				data: {
					originaladdress: video.sourceUrl,
					sourceType: 'YOUTUBE_COLLECTION',
					title: video.title || '',
					author: video.author || '',
					batchId: batchId
				},
                success: function(response) {
                    if (response.resCode === '000001') completed++;
                    else failed++;
                },
                error: function() { failed++; },
                complete: submitNext
            });
        };
        submitNext();
    }
    
    /**
     * 格式化时长
     * @param {number} seconds - 秒数
     * @returns {string} 格式化后的时长
     */
    function formatDuration(seconds) {
        if (!seconds) return '未知';
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        
        if (hours > 0) {
            return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        } else {
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
    }
    
    /**
     * HTML转义
     * @param {string} text - 要转义的文本
     * @returns {string} 转义后的文本
     */
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

	$('#resultContent').on('click', '[data-copy-url]', function() {
		copyToClipboard($(this).attr('data-copy-url') || '');
	});

	$('#resultContent').on('click', '[data-open-url]', function() {
		const url = $(this).attr('data-open-url') || '';
		if (/^https?:\/\//i.test(url)) window.open(url, '_blank', 'noopener,noreferrer');
	});
    
    /**
     * 复制文本到剪贴板
     * @param {string} text - 要复制的文本
     */
    window.copyToClipboard = function(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                layer.msg('链接已复制到剪贴板', {icon: 1});
            }).catch(function(err) {
                console.error('复制失败:', err);
                fallbackCopyTextToClipboard(text);
            });
        } else {
            fallbackCopyTextToClipboard(text);
        }
    };
    
    /**
     * 备用复制方法
     * @param {string} text - 要复制的文本
     */
    function fallbackCopyTextToClipboard(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                layer.msg('链接已复制到剪贴板', {icon: 1});
            } else {
                layer.msg('复制失败，请手动复制', {icon: 2});
            }
        } catch (err) {
            console.error('复制失败:', err);
            layer.msg('复制失败，请手动复制', {icon: 2});
        }
        
        document.body.removeChild(textArea);
    }
});
</script>
