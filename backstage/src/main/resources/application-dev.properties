#spring.profiles=dev
## tomcat \u7AEF\u53E3
server.port=28082
server.version=0.0.4
app.name=aoo
spring.application.name=aoo

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
streamvault.database.kind=sqlite
streamvault.sqlite.writer-lock.warn-after-ms=1000
streamvault.sqlite.writer-lock.timeout-ms=30000
streamvault.sqlite.write-retry.max-attempts=6
streamvault.sqlite.write-retry.initial-delay-ms=150
streamvault.sqlite.write-retry.max-delay-ms=2000
streamvault.collect.fetch-workers=1
streamvault.collect.download-workers=1
streamvault.collect.download-batch-size=10
streamvault.collect.download-lock-timeout-minutes=30
streamvault.collect.download-max-retries=3
streamvault.collect.incremental-known-boundary=20
streamvault.collect.incremental-max-pages=20
streamvault.collect.audit-max-pages=500
streamvault.collect.empty-page-limit=3
streamvault.collect.snapshot.max-bytes=1048576
streamvault.collect.snapshot.format-version=2
streamvault.database-maintenance.apply-enabled=false
streamvault.database-maintenance.preview-token-ttl-seconds=1800
streamvault.feed.keyset.enabled=true
streamvault.feed.cursor-secret=${STREAMVAULT_FEED_CURSOR_SECRET:}
streamvault.media.faststart.enabled=${STREAMVAULT_MEDIA_FASTSTART_ENABLED:true}
spring.datasource.url=jdbc:sqlite:d:\\flower\\db\\spirit.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=on&synchronous=NORMAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=10000

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl



spring.jpa.show-sql=false
spring.jpa.generate-ddl=true  
spring.jpa.hibernate.ddl-auto=update

# thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.content-type=text/html 
spring.thymeleaf.cache=false


logging.config=classpath:logback.xml
logging.file.path=/app/log/
logging.file.name=app.log



spring.mvc.static-path-pattern=/static/**
 
## \u9759\u6001\u8D44\u6E90\u4E0A\u4F20\u6587\u4EF6
file.app.path:D:/home/spirit/
file.save.path:D:/home/spirit/resources/
file.save.staticAccessPath:/cos/**
file.save:/cos

# Quartz \u914D\u7F6E
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=2
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.scheduler.instanceName=CollectDataScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.simpl.RAMJobStore

# Multi-platform single-work adapters remain on legacy paths until individually validated.
streamvault.adapter.douyin=legacy
streamvault.adapter.bilibili=legacy
streamvault.adapter.youtube=legacy
streamvault.adapter.kuaishou=legacy
streamvault.adapter.xiaohongshu=legacy
streamvault.adapter.weibo=legacy
streamvault.adapter.twitter=legacy
streamvault.adapter.instagram=legacy
streamvault.adapter.tiktok=legacy
streamvault.adapter.generic=legacy
