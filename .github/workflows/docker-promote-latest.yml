name: Promote image to latest
run-name: Promote ${{ inputs.image_tag }} to latest

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing stable version tag (e.g., 4.1.3)'
        required: true
        type: string
      source_digest:
        description: 'Expected published image index digest (sha256:...)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: jonysun/stream-vault
      SOURCE_TAG: ${{ inputs.image_tag }}
      SOURCE_DIGEST: ${{ inputs.source_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify source and publish latest
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          source_digest=$(docker buildx imagetools inspect "$IMAGE:$SOURCE_TAG" | awk '$1 == "Digest:" { print $2 }')
          if [ "$source_digest" != "$SOURCE_DIGEST" ]; then
            echo "Source tag digest does not match the expected published digest" >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "$IMAGE@$SOURCE_DIGEST" | jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          '
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$SOURCE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest" | tee latest-inspect.txt
          latest_digest=$(awk '$1 == "Digest:" { print $2 }' latest-inspect.txt)
          if [ "$latest_digest" != "$SOURCE_DIGEST" ]; then
            echo "Latest digest does not match the published version digest" >&2
            exit 1
          fi
          echo "Published $IMAGE:latest = $IMAGE:$SOURCE_TAG = $SOURCE_DIGEST"
